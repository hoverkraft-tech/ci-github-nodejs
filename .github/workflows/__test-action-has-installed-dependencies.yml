name: Internal - Tests for "has-installed-dependencies" action

on:
  workflow_call:

permissions: {}

jobs:
  test:
    name: Test "has-installed-dependencies" (${{ matrix.working-directory }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - working-directory: tests/npm
            package-manager: npm
            lock-file: package-lock.json

          - working-directory: tests/pnpm
            package-manager: pnpm
            lock-file: pnpm-lock.yaml

          - working-directory: tests/pnpm-package-manager
            package-manager: pnpm
            lock-file: pnpm-lock.yaml

          - working-directory: tests/yarn
            package-manager: yarn
            lock-file: yarn.lock
    steps:
      - name: Arrange - Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arrange - Setup Node.js runtime
        id: arrange-setup-node
        uses: ./actions/setup-node
        with:
          working-directory: ${{ matrix.working-directory }}

      - name: Arrange - Verify expected package manager
        id: arrange-check-package-manager
        env:
          ACTUAL_RUN_SCRIPT_COMMAND: ${{ steps.arrange-setup-node.outputs.run-script-command }}
          EXPECTED_PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: |
          if [[ "$ACTUAL_RUN_SCRIPT_COMMAND" != "$EXPECTED_PACKAGE_MANAGER"* ]]; then
            echo "Package manager is not $EXPECTED_PACKAGE_MANAGER"
            exit 1
          fi

      - name: Act - Run "has-installed-dependencies" action
        id: act-has-installed-dependencies
        uses: ./actions/has-installed-dependencies
        with:
          working-directory: ${{ matrix.working-directory }}
          dependencies: |
            gatsby
            jest
            nx
            prettier
            storybook
            unknown

      - name: Assert - Check "has-installed-dependencies" outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INSTALLED_DEPENDENCIES: ${{ steps.act-has-installed-dependencies.outputs.installed-dependencies }}
        with:
          script: |
            const assert = require("assert");

            const installedDependenciesOutput = process.env.INSTALLED_DEPENDENCIES;
            assert(installedDependenciesOutput.length, `"installed-dependencies" output is empty`);

            // Check if is valid JSON
            let installedDependencies = null;
            try {
              installedDependencies = JSON.parse(installedDependenciesOutput);
            } catch (error) {
              throw new Error(`"installed-dependencies" output is not a valid JSON: ${error}`);
            }

            const expectedResult = {
              gatsby: true,
              jest: true,
              nx: true,
              prettier: true,
              storybook: true,
              unknown: false,
            };

            assert.equal(
              JSON.stringify(installedDependencies),
              JSON.stringify(expectedResult),
              `"installed-dependencies" output is not valid`
            );
