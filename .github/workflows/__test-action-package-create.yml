name: Internal - Tests for "package/create" action

on:
  workflow_call:

permissions: {}

jobs:
  test:
    name: Test "package/create" (${{ matrix.working-directory }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-tarball-artifact-id-npm: ${{ steps.package-tarball-artifact.outputs.package-tarball-artifact-id-npm }}
      package-tarball-artifact-id-pnpm: ${{ steps.package-tarball-artifact.outputs.package-tarball-artifact-id-pnpm }}
      package-tarball-artifact-id-pnpm-package-manager: ${{ steps.package-tarball-artifact.outputs.package-tarball-artifact-id-pnpm-package-manager }}
      package-tarball-artifact-id-yarn: ${{ steps.package-tarball-artifact.outputs.package-tarball-artifact-id-yarn }}
    strategy:
      matrix:
        include:
          - working-directory: tests/npm
            artifact-suffix: npm
            package-manager: npm
          - working-directory: tests/pnpm
            artifact-suffix: pnpm
            package-manager: pnpm
          - working-directory: tests/pnpm-package-manager
            artifact-suffix: pnpm-package-manager
            package-manager: pnpm
          - working-directory: tests/yarn
            artifact-suffix: yarn
            package-manager: yarn
    steps:
      - name: Arrange - Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arrange - Configure the package runtime
        uses: $/actions/setup-node
        with:
          working-directory: ${{ matrix.working-directory }}
          install-dependencies: "false"

      - name: Arrange - Record native package manager calls
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: |
          wrapper_directory="$(mktemp -d)"
          echo "NATIVE_PACKAGE_MANAGER=$(command -v "$PACKAGE_MANAGER")" >> "$GITHUB_ENV"
          echo "PACK_COMMAND_LOG=$wrapper_directory/pack.log" >> "$GITHUB_ENV"
          cat > "$wrapper_directory/$PACKAGE_MANAGER" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$*" >> "$PACK_COMMAND_LOG"
          exec "$NATIVE_PACKAGE_MANAGER" "$@"
          SH
          chmod +x "$wrapper_directory/$PACKAGE_MANAGER"
          echo "$wrapper_directory" >> "$GITHUB_PATH"

      - name: Arrange - Prepare files and hooks that must not run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKING_DIRECTORY: ${{ matrix.working-directory }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const directory = process.env.WORKING_DIRECTORY;
            const manifestPath = path.join(directory, 'package.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = '1.2.3';
            manifest.files = ['dist'];
            manifest.scripts = Object.fromEntries(['preinstall', 'install', 'postinstall', 'preversion', 'version', 'postversion', 'prepare', 'prepack', 'postpack'].map(name => [name, 'exit 91']));
            manifest.devDependencies = { 'must-not-install': 'file:./missing' };
            fs.writeFileSync(manifestPath, JSON.stringify(manifest));
            if (manifest.packageManager) fs.writeFileSync(path.join(directory, 'yarn.lock'), '# Conflicting lockfile: packageManager takes precedence.\n');
            await io.mkdirP(path.join(directory, 'dist'));
            fs.writeFileSync(path.join(directory, 'dist/prepared.txt'), 'prepared before packaging\n');

      - name: Act - Reject an invalid artifact ID
        id: invalid-artifact
        continue-on-error: true
        uses: $/actions/package/create
        with:
          working-directory: ${{ matrix.working-directory }}
          build-artifact-id: "0"
      - name: Assert - Reject the artifact before packaging
        env:
          OUTCOME: ${{ steps.invalid-artifact.outcome }}
        run: test "$OUTCOME" = failure

      - name: Act - Run "package/create" action
        id: act-package
        uses: $/actions/package/create
        with:
          working-directory: ${{ matrix.working-directory }}
          artifact-name: package-tarball-${{ github.job }}-${{ matrix.artifact-suffix }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assert - Check "package/create" outputs
        env:
          PACKAGE_TARBALL_PATH: ${{ steps.act-package.outputs.package-tarball-path }}
          PACKAGE_TARBALL_ARTIFACT_ID: ${{ steps.act-package.outputs.package-tarball-artifact-id }}
        run: |
          if [ -z "$PACKAGE_TARBALL_PATH" ]; then
            echo "package-tarball-path output is empty"
            exit 1
          fi

          if [ ! -f "$PACKAGE_TARBALL_PATH" ]; then
            echo "Generated package tarball does not exist"
            exit 1
          fi

          if [ -z "$PACKAGE_TARBALL_ARTIFACT_ID" ]; then
            echo "package-tarball-artifact-id output is empty"
            exit 1
          fi

      - name: Assert - Preserve prepared files and the source version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKING_DIRECTORY: ${{ matrix.working-directory }}
          TARBALL: ${{ steps.act-package.outputs.package-tarball-path }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const path = require('node:path');
            const directory = process.env.WORKING_DIRECTORY;
            assert.match(fs.readFileSync(process.env.PACK_COMMAND_LOG, 'utf8'), /^pack /m);
            const { stdout: contents } = await exec.getExecOutput('tar', ['-xOf', process.env.TARBALL, 'package/dist/prepared.txt']);
            const { stdout: manifest } = await exec.getExecOutput('tar', ['-xOf', process.env.TARBALL, 'package/package.json']);
            assert.equal(contents, 'prepared before packaging\n');
            assert.equal(fs.readFileSync(path.join(directory, 'dist/prepared.txt'), 'utf8'), contents);
            assert.equal(JSON.parse(manifest).version, '1.2.3');
            assert.equal(JSON.parse(fs.readFileSync(path.join(directory, 'package.json'), 'utf8')).version, '1.2.3');
            assert.equal(fs.existsSync(path.join(directory, 'node_modules')), false);

      - id: package-tarball-artifact
        name: Arrange - Export package tarball artifact ID
        env:
          ARTIFACT_SUFFIX: ${{ matrix.artifact-suffix }}
          PACKAGE_TARBALL_ARTIFACT_ID: ${{ steps.act-package.outputs.package-tarball-artifact-id }}
        run: echo "package-tarball-artifact-id-${ARTIFACT_SUFFIX}=${PACKAGE_TARBALL_ARTIFACT_ID}" >> "$GITHUB_OUTPUT"

  assert-package-tarball:
    name: Assert package tarball (${{ matrix.working-directory }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - working-directory: tests/npm
            artifact-suffix: npm
            install-command: npm install --ignore-scripts --force --legacy-peer-deps --no-audit --no-fund --loglevel=warn
            package-tarball-artifact-id: ${{ needs.test.outputs['package-tarball-artifact-id-npm'] }}
          - working-directory: tests/pnpm
            artifact-suffix: pnpm
            install-command: pnpm install --ignore-scripts
            package-tarball-artifact-id: ${{ needs.test.outputs['package-tarball-artifact-id-pnpm'] }}
          - working-directory: tests/pnpm-package-manager
            artifact-suffix: pnpm-package-manager
            install-command: pnpm install --ignore-scripts
            package-tarball-artifact-id: ${{ needs.test.outputs['package-tarball-artifact-id-pnpm-package-manager'] }}
          - working-directory: tests/yarn
            artifact-suffix: yarn
            install-command: yarn add --ignore-scripts
            package-tarball-artifact-id: ${{ needs.test.outputs['package-tarball-artifact-id-yarn'] }}
    steps:
      - name: Arrange - Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arrange - Configure Node.js version
        run: cp "$GITHUB_WORKSPACE/.node-version" .nvmrc
        working-directory: ${{ matrix.working-directory }}

      - name: Arrange - Setup Node.js runtime
        id: arrange-setup-node
        uses: $/actions/setup-node
        with:
          working-directory: ${{ matrix.working-directory }}
          install-dependencies: "false"

      - name: Assert - Check package tarball artifact ID
        env:
          PACKAGE_TARBALL_ARTIFACT_ID: ${{ matrix.package-tarball-artifact-id }}
        run: |
          if [ -z "$PACKAGE_TARBALL_ARTIFACT_ID" ]; then
            echo "package-tarball-artifact-id output is empty"
            exit 1
          fi

      - name: Assert - Download package tarball artifact by ID
        id: download-package-tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ matrix.package-tarball-artifact-id }}
          path: ${{ runner.temp }}
          skip-decompress: true
          github-token: ${{ github.token }}

      - name: Assert - Check downloaded package tarball artifact
        env:
          DOWNLOAD_PATH: ${{ steps.download-package-tarball.outputs.download-path }}
          INSTALL_COMMAND: ${{ matrix.install-command }}
        run: |
          tarball_path="$DOWNLOAD_PATH"

          if [ -d "$tarball_path" ]; then
            tarball_matches="$(find "$tarball_path" -maxdepth 1 -type f -name '*.tgz')"
            tarball_count="$(printf '%s\n' "$tarball_matches" | sed '/^$/d' | wc -l)"

            if [ "$tarball_count" -ne 1 ]; then
              echo "Expected exactly one downloaded package tarball, found $tarball_count"
              exit 1
            fi

            tarball_path="$tarball_matches"
          fi

          if [ ! -f "$tarball_path" ]; then
            echo "Downloaded package tarball artifact does not exist"
            exit 1
          fi

          # Disable strict dep builds check for pnpm v11+ (strictDepBuilds defaults to true)
          if [[ "$INSTALL_COMMAND" == pnpm* ]]; then
            echo 'strictDepBuilds: false' > pnpm-workspace.yaml
          fi

          # Install the tarball to verify it's a valid npm package
          $INSTALL_COMMAND "$tarball_path"
