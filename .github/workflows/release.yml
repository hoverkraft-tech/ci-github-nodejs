# Package an existing build artifact and publish a Node.js release without rebuilding.
# Call at the prepared tag with a build artifact from the same workflow run and commit.
name: Node.js Release

on:
  workflow_call:
    inputs:
      packages:
        description: JSON array containing one public npm package from prepare-package-release.
        type: string
        required: true
      build-artifact-id:
        description: Build artifact ID from this workflow run and the prepared tag's commit. The artifact must be unexpired and contain every generated package file with absolute paths preserved for the default Ubuntu runner layout. Any job can produce it.
        type: string
        required: true
      working-directory:
        description: Project directory relative to the caller repository root, matching release preparation and the build artifact's source directory.
        type: string
        default: .
      package-tests:
        description: Shell commands testing the tarball before publication. Runs from working-directory with PACKAGE_TARBALL_PATH, PACKAGE_NAME and PACKAGE_VERSION.
        type: string
        default: ""
      changelog-summary:
        description: |
          Optional JSON configuration forwarded unchanged to ci-github-publish/actions/release/create.
          Supports all upstream summary options. Use the changelog-summary secret when the configuration contains credentials.
          A non-empty secret overrides this input; omit both to disable summarization. Summary failures stop publication.
          See https://github.com/hoverkraft-tech/ci-github-publish/tree/main/actions/release/create.
        type: string
        default: ""
      environment:
        description: Optional GitHub environment for release jobs. Leave empty to run without an environment. When set, its protection rules apply; use the same name if restricting npm trusted publishing to an environment.
        type: string
        default: ""
    secrets:
      changelog-summary:
        description: Optional complete JSON summary configuration, including provider credentials. Overrides the changelog-summary input and is forwarded unchanged to ci-github-publish/actions/release/create.
        required: false

permissions: {}

concurrency:
  group: node-release-publish-${{ github.repository }}-${{ inputs.working-directory }}
  cancel-in-progress: false

jobs:
  publish:
    name: Release npm package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - id: verify
        uses: $/actions/release/verify
        with:
          packages: ${{ inputs.packages }}
          build-artifact-id: ${{ inputs.build-artifact-id }}
          working-directory: ${{ inputs.working-directory }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hoverkraft-tech/ci-github-publish/actions/release/create@ea6682de88070c254dac619a6623a242a6d57cd3 # 1.0.3
        with:
          tag: ${{ github.ref_name }}
          target-sha: ${{ github.sha }}
          working-directory: ${{ inputs.working-directory != '.' && inputs.working-directory || '' }}
          publish: "false"
          changelog-summary: ${{ secrets.changelog-summary || inputs.changelog-summary }}
        name: Create draft and optional AI summary
        if: steps.verify.outputs.published != 'true'
      - name: Configure the package runtime
        id: setup-node
        uses: $/actions/setup-node
        with:
          working-directory: ${{ inputs.working-directory }}
          install-dependencies: "false"
      - name: Package the build artifact
        id: package
        uses: $/actions/package/create
        with:
          working-directory: ${{ inputs.working-directory }}
          build-artifact-id: ${{ inputs.build-artifact-id }}
          build-artifact-path: /
          artifact-name: npm-${{ fromJSON(inputs.packages)[0].slug }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: $/actions/package/restore
        with:
          name: ${{ fromJSON(inputs.packages)[0].name }}
          version: ${{ fromJSON(inputs.packages)[0].version }}
          tarball-path: ${{ steps.package.outputs.package-tarball-path }}
      - name: Test installed package behavior
        uses: $/actions/package/test
        with:
          commands: ${{ inputs.package-tests }}
          working-directory: ${{ inputs.working-directory }}
          tarball-path: ${{ steps.package.outputs.package-tarball-path }}
          name: ${{ fromJSON(inputs.packages)[0].name }}
          version: ${{ fromJSON(inputs.packages)[0].version }}
      - name: Validate publication
        uses: $/actions/package/publish
        with:
          package-tarball-artifact-id: ${{ steps.package.outputs.package-tarball-artifact-id }}
          dry-run: "true"
          provenance: "false"
      - name: Publish missing npm version
        id: publish
        uses: $/actions/package/publish
        with:
          package-tarball-artifact-id: ${{ steps.package.outputs.package-tarball-artifact-id }}
          skip-existing: "true"
          tag: latest
      - name: Prepare release asset
        env:
          PACKAGE_TARBALL: ${{ steps.publish.outputs.package-tarball-path }}
          ASSET_NAME: ${{ fromJSON(inputs.packages)[0].slug }}-${{ fromJSON(inputs.packages)[0].version }}.tgz
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$PACKAGE_TARBALL" "$RUNNER_TEMP/release-assets/$ASSET_NAME"
      - uses: $/actions/release/finalize
        with:
          tag: ${{ github.ref_name }}
