# Workflow to performs continuous integration steps against a Node.js project:
#
# - CodeQL analysis
# - Linting
# - Build
# - Test

name: Node.js Continuous Integration

on:
  workflow_call:
    inputs:
      ignore-scripts:
        description: |
          Disable project and dependency lifecycle scripts during installation in build, lint and test jobs.
          Set false to allow installation hooks, subject to the package manager's script approval settings.
          Explicit commands are unaffected. Does not apply in container mode, which skips installation.
        type: boolean
        default: true
      runs-on:
        description: |
          JSON array of runner(s) to use.
          See https://docs.github.com/en/actions/using-jobs/choosing-the-runner-for-a-job.
        type: string
        default: '["ubuntu-latest"]'
        required: false
      build:
        description: |
          Build parameters. Accepts newline-separated commands, a JSON array, or a JSON object.
          An empty or whitespace-only string skips the build job; tests and optional packaging can run without it.
          For string, provide a list of commands to run during the build step, one per line.
          For JSON object, provide the following properties:

          - `commands`: Array of commands to run during the build step.
          - `env`: Object of environment variables to set during the build step.
          - `artifact`: String or array of strings specifying paths to artifacts to upload after the build

          Example:
          ```json
          {
            "commands": [
              "build",
              "generate-artifacts"
            ],
            "env": {
              "CUSTOM_ENV_VAR": "value"
            },
            "artifact": [
              "dist/",
              "packages/package-a/build/"
            ]
          }
          ```
        type: string
        required: false
        default: "build"
      package:
        description: |
          Create and validate public npm packages from the checked-out source and build output.
          Pass "false" (the default) to disable, "true" for automatic package discovery and default checks,
          or a JSON object to enable packaging with specific options. Quote booleans because this input has type string.

          - `directories`: Optional array of public package directories relative to working-directory. Omit to discover workspaces or the standalone root package. Private packages are excluded.
          - `tests`: Optional shell commands after default manifest and entry-point checks. Runs in an isolated npm consumer with lifecycle scripts disabled and installed binaries on PATH.
          - `test-project`: Optional consumer fixture directory relative to working-directory. Its dependencies and scripts are copied without node_modules or Git metadata. Requires `tests`.

          PACKAGE_INSTALL_PATH, PACKAGE_TARBALL_PATH, PACKAGE_NAME and PACKAGE_VERSION identify the tested package.
          All workspace tarballs are created before consumer tests. Declared workspace dependencies are installed
          from these local tarballs, so unpublished versions can be validated together.
          The consumer is cleaned up on success or failure. Commands must not modify tarballs.
          Requires non-container CI with the default Ubuntu artifact layout.
          Unknown options and invalid field types are rejected before build or packaging.

          Example: `{"tests":"my-cli --help"}`
        type: string
        default: "false"
      checks:
        description: "Optional flag to enable check steps."
        type: boolean
        required: false
        default: true
      lint:
        description: |
          Whether to enable linting.
          Set to `null` or empty to disable.
          Accepts a JSON object for lint options. See [lint action](../../actions/lint/README.md).
          It should generate lint reports in standard formats.

          Example:

          ```json:package.json
          {
            "lint:ci": "eslint . --output-file eslint-report.json --format json"
          }
          ```
        type: string
        required: false
        default: "true"
      code-ql:
        description: |
          CodeQL analysis language, or a JSON object with `languages` and optional `config-file`.
          Set to an empty string to disable CodeQL.
          In JSON form, `languages` must be a nonempty string and `config-file` must be a string.
          Omitting or leaving `config-file` empty keeps CodeQL's default configuration behavior.
          Unknown JSON properties and invalid field types fail before CodeQL initialization.
          Local configuration paths are relative to the caller repository root, not `working-directory`.
          See https://github.com/github/codeql-action.

          Example:
          ```json
          {
            "languages": "javascript-typescript",
            "config-file": ".github/codeql/config.yml"
          }
          ```
        type: string
        required: false
        default: "typescript"
      dependency-review:
        description: |
          Enable dependency review scan.
          Works with public repositories and private repositories with a GitHub Advanced Security license.
          See https://github.com/actions/dependency-review-action.
        type: boolean
        required: false
        default: true
      test:
        description: |
          Whether to enable testing.
          Set to `null` or empty to disable.
          Accepts a JSON object for test options. See [test action](../../actions/test/README.md).
          If coverage is enabled, it should generate test and coverage reports in standard formats.
          For consolidated reports, set `comment` to false and `report-group` to the calling job ID
          used in the common `ci-reports` workflow's `job-results`.

          Example:

          ```json:package.json
          {
            "test:ci": "vitest run --reporter=default --reporter=junit --outputFile=junit.xml --coverage.enabled --coverage.reporter=lcov --coverage.reporter=text"
          }
          ```
        type: string
        required: false
        default: "true"
      working-directory:
        description: |
          Working directory where dependencies and application commands run.
          Relative paths resolve against the workspace of each application job.
          Directory existence and non-container workspace boundaries are validated in those jobs.
        type: string
        required: false
        default: "."
      container:
        description: |
          Container configuration to run CI steps in.
          Accepts either a string (container image name) or a JSON object with container options.

          String format (simple):

          ```yml
          container: "node:18"
          ```

          JSON object format (advanced):

          ```json
          {
            "image": "node:18",
            "env": {
              "NODE_ENV": "production"
            },
            "options": "--cpus 2",
            "ports": [8080, 3000],
            "volumes": ["/tmp:/tmp", "/cache:/cache"],
            "credentials": {
              "username": "myusername"
            },
            "pathMapping": {
              "/app": "./relative/path/to/app"
            }
          }
          ```

          Supported properties:

          - `image` (required)
          - `env` (object)
          - `options` (string)
          - `ports` (array)
          - `volumes` (array)
          - `credentials` (object with `username`).
          - `pathMapping` (object) path mapping from container paths to repository paths. Defaults is working directory is mapped with repository root.

          See https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/run-jobs-in-a-container.

          When specified, steps will execute inside this container instead of checking out code.
          The container should have the project code and dependencies pre-installed.
        type: string
        required: false
        default: ""
    secrets:
      build-secrets:
        description: |
          Secrets to be used during the build step.
          Must be a multi-line env formatted string.
          Example:
          ```txt
          SECRET_EXAMPLE=$\{{ secrets.SECRET_EXAMPLE }}
          ```
        required: false
      container-password:
        description: |
          Password for container registry authentication, if required.
          Used when the container image is hosted in a private registry.
          See https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/run-jobs-in-a-container#defining-credentials-for-a-container-registry.
        required: false
      github-token:
        description: |
          GitHub token to use for authentication.
          Defaults to `GITHUB_TOKEN` if not provided.
        required: false
    outputs:
      package-tarball-artifact-id:
        description: Artifact ID of the package validated by the packaging job. Available when package is enabled and validation succeeds.
        value: ${{ jobs.package-results.outputs.artifact-id }}
      package-tarball-artifacts:
        description: JSON object mapping package directories to validated tarball artifact IDs when packaging is enabled. Require successful CI before publication.
        value: ${{ jobs.package-results.outputs.artifacts }}
      build-artifact-id:
        description: "ID of the build artifact) uploaded during the build step."
        value: ${{ jobs.build.outputs.artifact-id }}

permissions: {}

jobs:
  prepare:
    name: 📦 Prepare configuration
    runs-on: &ci-runner ${{ inputs.runs-on && fromJson(inputs.runs-on) || 'ubuntu-latest' }}
    permissions: {}
    outputs:
      container-image: ${{ steps.parse.outputs.container-image }}
      container-env: ${{ steps.parse.outputs.container-env }}
      container-options: ${{ steps.parse.outputs.container-options }}
      container-ports: ${{ steps.parse.outputs.container-ports }}
      container-volumes: ${{ steps.parse.outputs.container-volumes }}
      container-username: ${{ steps.parse.outputs.container-username }}
      path-mapping: ${{ steps.parse.outputs.path-mapping }}
      package-enabled: ${{ steps.package-config.outputs.enabled }}
      package-directories: ${{ steps.package-config.outputs.directories }}
      package-tests: ${{ steps.package-config.outputs.tests }}
      package-test-project: ${{ steps.package-config.outputs.test-project }}
      working-directory: ${{ steps.build-variables.outputs.working-directory }}
      build-env: ${{ steps.build-variables.outputs.env }}
      build-commands: ${{ steps.build-variables.outputs.commands }}
      build-artifact: ${{ steps.build-variables.outputs.artifact }}
    steps:
      - id: package-config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGE_INPUT: ${{ inputs.package }}
          CONTAINER_INPUT: ${{ inputs.container }}
        with:
          script: |
            let config;
            try {
              config = JSON.parse(process.env.PACKAGE_INPUT.trim() || 'false');
            } catch {
              throw new Error('package must be true, false, or a JSON object.');
            }
            if (typeof config !== 'boolean' && (!config || typeof config !== 'object' || Array.isArray(config))) {
              throw new Error('package must be true, false, or a JSON object.');
            }
            const enabled = config !== false;
            if (typeof config === 'boolean') config = {};
            const allowed = ['directories', 'tests', 'test-project'];
            const unknown = Object.keys(config).filter(key => !allowed.includes(key));
            if (unknown.length) throw new Error(`Unknown package options: ${unknown.join(', ')}.`);
            const { directories, tests = '', 'test-project': testProject = '' } = config;
            if (typeof tests !== 'string' || typeof testProject !== 'string') {
              throw new Error('package.tests and package.test-project must be strings.');
            }
            const path = require('node:path');
            const relativeDirectory = value => typeof value === 'string' && value.trim() !== '' &&
              !path.posix.isAbsolute(value) && !path.win32.isAbsolute(value) &&
              !value.split(/[\\/]/).includes('..') && !/[\r\n\0]/.test(value);
            if (directories !== undefined && (!Array.isArray(directories) || !directories.length || directories.length > 256 ||
                directories.some(directory => !relativeDirectory(directory)) || new Set(directories).size !== directories.length)) {
              throw new Error('package.directories must contain 1 to 256 unique relative directories inside the project.');
            }
            if (testProject && !relativeDirectory(testProject)) throw new Error('package.test-project must be a directory inside the project.');
            if (testProject && !tests.trim()) throw new Error('package.test-project requires package.tests.');
            if (enabled && process.env.CONTAINER_INPUT.trim()) {
              throw new Error('Package validation requires non-container CI with the default Ubuntu artifact layout.');
            }
            core.setOutput('enabled', enabled);
            core.setOutput('directories', directories === undefined ? '' : directories);
            core.setOutput('tests', tests);
            core.setOutput('test-project', testProject);
      - id: parse
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONTAINER_INPUT: ${{ inputs.container }}
          CONTAINER_PASSWORD: ${{ secrets.container-password }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        with:
          script: |
            const containerInput = process.env.CONTAINER_INPUT.trim();
            if (!containerInput) {
              return;
            }
            core.debug(`Container input: ${containerInput}`);

            // Check if input is a JSON object or a simple string
            const isJson = containerInput.startsWith('{');

            let container = {
              options: '--user root:root'
            };

            let pathMapping = {
              [process.env.WORKING_DIRECTORY || '.']: process.env.GITHUB_WORKSPACE,
            };

            if (isJson) {
              try {
                const {pathMapping: parsedPathMapping, ...parsedContainer} = JSON.parse(containerInput);
                core.debug(`Parsed container input as JSON: ${JSON.stringify(parsedContainer)}`);

                container = {
                  ...container,
                  ...parsedContainer,
                  options: `${container.options} ${parsedContainer.options || ''}`.trim()
                };

                core.debug(`Parsed path mapping: ${JSON.stringify(parsedPathMapping)}`);
                if (parsedPathMapping){
                  pathMapping = parsedPathMapping;
                }

              } catch (error) {
                return core.setFailed(`Failed to parse container input as JSON: ${error.message}`,{ cause: error });
              }
            } else {
              // Simple string format - just the image name
              container.image = containerInput;
            }

            core.debug(`Parsed container configuration: ${JSON.stringify(container)}`);

            if (!container.image) {
              return core.setFailed('Container image must be specified in the container input.');
            }
            core.setOutput('container-image', container.image);

            if (container.env) {
              core.setOutput('container-env', JSON.stringify(container.env));
            }

            if (container.options) {
              core.setOutput('container-options', container.options);
            }

            if (container.ports) {
              core.setOutput('container-ports', JSON.stringify(container.ports));
            }

            if (container.volumes) {
              core.setOutput('container-volumes', JSON.stringify(container.volumes));
            }

            if (container.credentials?.username) {
              core.setOutput('container-username', container.credentials.username);
              if (!process.env.CONTAINER_PASSWORD) {
                return core.setFailed('Container password must be provided when container credentials username is specified.');
              }
            } else if (process.env.CONTAINER_PASSWORD) {
              return core.setFailed('Container credentials username must be provided when container password is specified.');
            }

            core.debug(`Parsed path mapping: ${JSON.stringify(pathMapping)}`);
            if (!pathMapping || typeof pathMapping !== 'object' || Object.keys(pathMapping).length === 0){
              return core.setFailed('At least one path mapping must be specified in the container configuration.');
            }

            core.setOutput('path-mapping', Object.entries(pathMapping).reduce((acc, [containerPath, repoPath]) => {
              acc += `${acc?',' : ''}${containerPath}:${repoPath}`;
              return acc;
            }, ""));

      - id: build-variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          BUILD_INPUT: ${{ inputs.build }}
        with:
          script: |
            const path = require('node:path');

            const workingDirectory = path.normalize(process.env.WORKING_DIRECTORY || '.');
            core.setOutput('working-directory', workingDirectory);
            const buildInput = process.env.BUILD_INPUT.trim();
            if (!buildInput) {
              core.setOutput('commands', '');
              core.setOutput('env', '{}');
              return;
            }

            let commands = [];
            let env = {};

            // Build commands is a list of command(s), one per line.
            const buildCommandsIsList = !buildInput.trim().startsWith('{') && !buildInput.trim().startsWith('[');
            if (buildCommandsIsList) {
              commands = buildInput.split('\n').map(command => command.trim()).filter(Boolean);
            } else {
              let build;
              try {
                build = JSON.parse(buildInput);
              } catch (error) {
                core.setFailed(`Failed to parse build input as JSON: ${error.message}`);
                return;
              }

              // Build commands is a JSON array of commands
              if (Array.isArray(build)) {
                commands = build;
              }
              // Build commands is a JSON object
              else {
                commands = build.commands ?? ["build"];
                env = build.env ?? {};

                if (build.artifact) {
                  let buildArtifact = build.artifact;

                  if (typeof buildArtifact === 'string' || Array.isArray(buildArtifact)) {
                    buildArtifact = {
                      paths: buildArtifact
                    };
                  }

                  if (!buildArtifact || typeof buildArtifact !== 'object') {
                    return core.setFailed('Build artifact must be a path, path array or options object');
                  }

                  if (typeof buildArtifact.paths === 'string') {
                    buildArtifact.paths = buildArtifact.paths.split('\n');
                  }
                  if (!Array.isArray(buildArtifact.paths) || buildArtifact.paths.some(artifact => typeof artifact !== 'string')) {
                    return core.setFailed('Build artifact paths must be a string or an array of strings');
                  }

                  buildArtifact.paths = buildArtifact.paths
                    .map(artifact => artifact.trim())
                    .filter(Boolean)
                    .join('\n');

                  if (!buildArtifact.paths) {
                    return core.setFailed('No valid build artifact paths found');
                  }

                  // Generate a unique name for the artifact
                  buildArtifact.name = `${process.env.GITHUB_JOB}-build-${process.env.GITHUB_RUN_ID}-${Math.random().toString(36).substring(2, 8)}`;

                  core.setOutput('artifact', JSON.stringify(buildArtifact));
                }
              }
            }

            if (!Array.isArray(commands) || commands.some(command => typeof command !== 'string')) {
              core.setFailed('Build commands array must only contain strings');
              return;
            }

            if (!env || typeof env !== 'object' || Array.isArray(env)) {
              return core.setFailed('Build env must be an object');
            }

            const sanitizedCommands = commands.map(command => command.trim()).filter(Boolean);
            if (!sanitizedCommands.length) {
              return core.setFailed('No build commands found');
            }

            core.setOutput('commands', sanitizedCommands.join('\n'));
            core.setOutput('env', JSON.stringify(env));

  code-ql:
    name: 🛡️ CodeQL Analysis
    if: inputs.checks == true && inputs.code-ql != ''
    permissions:
      security-events: write
    runs-on: *ci-runner
    steps:
      - uses: hoverkraft-tech/ci-github-common/actions/checkout@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
      - id: code-ql-options
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CODE_QL: ${{ inputs.code-ql }}
        with:
          script: |
            const input = process.env.CODE_QL.trim();
            let options = { languages: input };

            if (input.startsWith('{')) {
              try {
                options = JSON.parse(input);
              } catch {
                return core.setFailed('code-ql must be a language string or a valid JSON object.');
              }
            }

            if (Object.keys(options).some(key => !['languages', 'config-file'].includes(key))) {
              return core.setFailed('code-ql supports only languages and config-file.');
            }
            if (typeof options.languages !== 'string' || !options.languages.trim()) {
              return core.setFailed('code-ql.languages must be a nonempty string.');
            }
            if (options['config-file'] !== undefined && typeof options['config-file'] !== 'string') {
              return core.setFailed('code-ql.config-file must be a string.');
            }

            core.setOutput('languages', options.languages);
            core.setOutput('config-file', options['config-file'] ?? '');
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ steps.code-ql-options.outputs.languages }}
          config-file: ${{ steps.code-ql-options.outputs.config-file }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  dependency-review:
    name: 🛡️ Dependency Review
    if: github.event_name == 'pull_request' && inputs.checks == true && inputs.dependency-review
    permissions:
      contents: read
    runs-on: *ci-runner
    steps:
      - uses: hoverkraft-tech/ci-github-common/actions/checkout@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  lint:
    if: inputs.checks == true && inputs.lint
    name: 👕 Lint
    runs-on: *ci-runner
    container: &ci-container
      image: ${{ needs.prepare.outputs.container-image || '' }}
      env: ${{ fromJSON(needs.prepare.outputs.container-env || '{}') }}
      options: ${{ needs.prepare.outputs.container-options || ' ' }}
      ports: ${{ fromJSON(needs.prepare.outputs.container-ports || '[]') }}
      volumes: ${{ fromJSON(needs.prepare.outputs.container-volumes || '[]') }}
      credentials: ${{ fromJSON(needs.prepare.outputs.container-username && format('{{"username":{0},"password":{1}}}',toJSON(needs.prepare.outputs.container-username),toJSON(secrets.container-password)) || '{}') }}
    needs:
      - prepare
    permissions:
      contents: read
      packages: read
    steps:
      - uses: hoverkraft-tech/ci-github-common/actions/checkout@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
        if: inputs.container == ''

      - id: preparel-lint-options
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LINT_INPUT: ${{ inputs.lint }}
        with:
          script: |
            const lintInput = process.env.LINT_INPUT.trim();

            let lintOptions = {};
            if (lintInput && lintInput !== 'true') {
              try {
                const parsed = JSON.parse(lintInput);
                lintOptions = { ...lintOptions, ...parsed };
              } catch (error) {
                core.setFailed(`Failed to parse lint input as JSON: ${error.message}`);
                return;
              }
            }

            core.setOutput('command', lintOptions.command || 'lint:ci');
            core.setOutput('report-file', lintOptions['report-file'] || '');

      - name: Run lint
        uses: $/actions/lint
        with:
          ignore-scripts: ${{ inputs.ignore-scripts }}
          working-directory: ${{ needs.prepare.outputs.working-directory }}
          container: ${{ inputs.container != '' && 'true' || 'false' }}
          command: ${{ steps.preparel-lint-options.outputs.command }}
          report-file: ${{ steps.preparel-lint-options.outputs.report-file }}
          path-mapping: ${{ needs.prepare.outputs.path-mapping || '' }}

  build:
    if: inputs.checks == true && needs.prepare.outputs.build-commands != ''
    name: 🏗️ Build
    runs-on: *ci-runner
    container: *ci-container
    needs:
      - prepare
    permissions:
      contents: read
      packages: read
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
    steps:
      - uses: hoverkraft-tech/ci-github-common/actions/checkout@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
        if: inputs.container == ''

      - id: build-artifact
        if: needs.prepare.outputs.build-artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKING_DIRECTORY: ${{ needs.prepare.outputs.working-directory }}
          BUILD_ARTIFACT: ${{ needs.prepare.outputs.build-artifact }}
        with:
          script: |
            const path = require('node:path');
            const workingDirectory = path.resolve(process.env.GITHUB_WORKSPACE, process.env.WORKING_DIRECTORY);
            const artifact = JSON.parse(process.env.BUILD_ARTIFACT);
            artifact.paths = artifact.paths.split('\n').map(artifactPath => {
              const fullPath = path.resolve(workingDirectory, artifactPath);
              // Preserve the full directory layout used by artifact consumers.
              return fullPath.replace(/\/([^/]+)/, '/*$1');
            }).join('\n');
            core.setOutput('artifact', JSON.stringify(artifact));

      - id: build
        uses: $/actions/build
        with:
          ignore-scripts: ${{ inputs.ignore-scripts }}
          container: ${{ inputs.container != '' && 'true' || 'false' }}
          working-directory: ${{ needs.prepare.outputs.working-directory }}
          build-secrets: ${{ secrets.build-secrets }}
          build-commands: ${{ needs.prepare.outputs.build-commands }}
          build-env: ${{ needs.prepare.outputs.build-env }}
          build-artifact: ${{ steps.build-artifact.outputs.artifact }}

  test:
    if: >-
      ${{ !cancelled() && inputs.checks == true && inputs.test &&
          needs.prepare.result == 'success' &&
          (needs.build.result == 'success' ||
           (needs.build.result == 'skipped' && needs.prepare.outputs.build-commands == '')) }}
    name: 🧪 Test
    runs-on: *ci-runner
    container: *ci-container
    needs:
      - prepare
      - build
    permissions:
      contents: read
      id-token: write # Required for Codecov uploads with OIDC authentication
      packages: read
      pull-requests: write
    steps:
      - uses: hoverkraft-tech/ci-github-common/actions/checkout@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
        if: inputs.container == ''

      - if: needs.build.outputs.artifact-id && inputs.container == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: "/"

      - id: prepare-test-options
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TEST_INPUT: ${{ inputs.test }}
        with:
          script: |
            const testInput = process.env.TEST_INPUT.trim();

            let testOptions = {};
            if (testInput && testInput !== 'true') {
              try {
                const parsed = JSON.parse(testInput);
                testOptions = { ...testOptions, ...parsed };
              } catch (error) {
                core.setFailed(`Failed to parse test input as JSON: ${error.message}`);
                return;
              }
            }

            if (testOptions.coverage === undefined) {
              testOptions.coverage = 'github';
            }
            if (testOptions.comment !== undefined && typeof testOptions.comment !== 'boolean') {
              throw new Error('test.comment must be a boolean.');
            }
            if (testOptions['report-group'] !== undefined &&
                (typeof testOptions['report-group'] !== 'string' || !/^[\w-]+$/.test(testOptions['report-group']))) {
              throw new Error('test.report-group must be a job ID containing letters, numbers, underscores or hyphens.');
            }
            core.setOutput('coverage', testOptions.coverage );
            core.setOutput('comment', testOptions.comment ?? true);
            core.setOutput('report-group', testOptions['report-group'] || '');
            core.setOutput('report-file', testOptions['report-file'] || '');
            core.setOutput('command', testOptions.command || 'test:ci');

      - name: Run tests
        uses: $/actions/test
        with:
          ignore-scripts: ${{ inputs.ignore-scripts }}
          working-directory: ${{ needs.prepare.outputs.working-directory }}
          container: ${{ inputs.container != '' && 'true' || 'false' }}
          command: ${{ steps.prepare-test-options.outputs.command }}
          coverage: ${{ steps.prepare-test-options.outputs.coverage }}
          comment: ${{ steps.prepare-test-options.outputs.comment }}
          report-group: ${{ steps.prepare-test-options.outputs.report-group }}
          report-file: ${{ steps.prepare-test-options.outputs.report-file }}
          path-mapping: ${{ needs.prepare.outputs.path-mapping || '' }}
          github-token: ${{ secrets.github-token || github.token }}

  discover-packages:
    name: Discover public packages
    if: inputs.checks == true && needs.prepare.outputs.package-enabled == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      directories: ${{ steps.packages.outputs.directories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: working-directory
        uses: hoverkraft-tech/ci-github-common/actions/working-directory@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
        with:
          working-directory: ${{ needs.prepare.outputs.working-directory }}
      - id: packages
        uses: $/actions/package/discover
        with:
          working-directory: ${{ steps.working-directory.outputs.absolute-path }}
          directories: ${{ needs.prepare.outputs.package-directories }}

  package:
    name: Create package ${{ matrix.directory }}
    if: >-
      ${{ !cancelled() && inputs.checks == true && needs.prepare.outputs.package-enabled == 'true' &&
          needs.prepare.result == 'success' && needs.discover-packages.result == 'success' &&
          (needs.build.result == 'success' ||
           (needs.build.result == 'skipped' && needs.prepare.outputs.build-commands == '')) }}
    needs: [prepare, discover-packages, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover-packages.outputs.directories) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-node
        uses: $/actions/setup-node
        with:
          working-directory: ${{ inputs.working-directory }}
          install-dependencies: "false"
      - name: Link pnpm workspace dependencies
        if: steps.setup-node.outputs.package-manager == 'pnpm'
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Package prepared files
        id: package
        uses: $/actions/package/create
        with:
          working-directory: ${{ inputs.working-directory }}
          package-directory: ${{ matrix.directory }}
          build-artifact-id: ${{ needs.build.outputs.artifact-id }}
          build-artifact-path: /
      - name: Record package artifact
        id: report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIRECTORY: ${{ matrix.directory }}
          PROJECT: ${{ inputs.working-directory }}
          ARTIFACT_ID: ${{ steps.package.outputs.package-tarball-artifact-id }}
          TARBALL: ${{ steps.package.outputs.package-tarball-path }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const report = path.join(process.env.RUNNER_TEMP, `${process.env.ARTIFACT_ID}.json`);
            fs.writeFileSync(report, JSON.stringify({ directory: process.env.DIRECTORY, project: process.env.PROJECT, artifactId: process.env.ARTIFACT_ID, tarball: path.basename(process.env.TARBALL), attempt: Number(process.env.GITHUB_RUN_ATTEMPT) }));
            core.setOutput('path', report);
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-package-manifest-${{ steps.package.outputs.package-tarball-artifact-id }}
          path: ${{ steps.report.outputs.path }}
          if-no-files-found: error

  package-manifests:
    name: Collect package artifacts
    if: >-
      ${{ !cancelled() && inputs.checks == true && needs.prepare.outputs.package-enabled == 'true' &&
          needs.prepare.result == 'success' && needs.discover-packages.result == 'success' &&
          needs.package.result == 'success' }}
    needs: [prepare, discover-packages, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.collect.outputs.artifact-id }}
      artifacts: ${{ steps.collect.outputs.artifacts }}
      artifact-ids: ${{ steps.collect.outputs.artifact-ids }}
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-package-manifest-*
          merge-multiple: true
          path: ${{ runner.temp }}/package-validation
      - id: collect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIRECTORIES: ${{ needs.discover-packages.outputs.directories }}
          PROJECT: ${{ inputs.working-directory }}
          REPORT_DIRECTORY: ${{ runner.temp }}/package-validation
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const directories = JSON.parse(process.env.DIRECTORIES);
            const files = await (await glob.create(path.join(process.env.REPORT_DIRECTORY, '*.json'), { followSymbolicLinks: false, matchDirectories: false })).glob();
            const reports = files.map(file => JSON.parse(fs.readFileSync(file, 'utf8'))).filter(report => report.project === process.env.PROJECT);
            const matrix = directories.map(directory => {
              const matches = reports.filter(report => report.directory === directory).sort((a, b) => b.attempt - a.attempt);
              const latest = matches[0];
              if (!latest || !/^[1-9][0-9]*$/.test(latest.artifactId) || !Number.isSafeInteger(Number(latest.artifactId)) || !/^[a-zA-Z0-9._-]+\.tgz$/.test(latest.tarball || '') ||
                  !Number.isSafeInteger(latest.attempt) || latest.attempt < 1 ||
                  (matches[1] && latest.attempt === matches[1].attempt)) {
                throw new Error(`Expected one package artifact for ${directory}.`);
              }
              return { directory, artifactId: latest.artifactId, tarball: latest.tarball };
            });
            const artifacts = Object.fromEntries(matrix.map(item => [item.directory, item.artifactId]));
            core.setOutput('matrix', matrix);
            core.setOutput('artifact-ids', matrix.map(item => item.artifactId).join(','));
            core.setOutput('artifacts', artifacts);
            if (directories.length === 1) core.setOutput('artifact-id', artifacts[directories[0]]);

  package-validation:
    name: Validate package ${{ matrix.directory }}
    if: ${{ !cancelled() && needs.package-manifests.result == 'success' }}
    needs: [prepare, package-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.package-manifests.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/actions/setup-node
        with:
          working-directory: ${{ inputs.working-directory }}
          install-dependencies: "false"
      - name: Download workspace tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package-manifests.outputs.artifact-ids }}
          path: ${{ runner.temp }}/workspace-tarballs
          skip-decompress: true
          merge-multiple: true
      - id: tarballs
        name: Locate package and dependency tarballs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARBALL_NAME: ${{ matrix.tarball }}
        with:
          script: |
            const path = require('node:path');
            const files = await (await glob.create(path.join(process.env.RUNNER_TEMP, 'workspace-tarballs', '**/*.tgz'), {
              followSymbolicLinks: false, matchDirectories: false,
            })).glob();
            const matches = files.filter(file => path.basename(file) === process.env.TARBALL_NAME);
            if (matches.length !== 1) throw new Error('Expected exactly one target package tarball.');
            core.setOutput('target', matches[0]);
            core.setOutput('dependencies', files.filter(file => file !== matches[0]));
      - name: Test the package as a consumer
        uses: $/actions/package/test
        with:
          working-directory: ${{ inputs.working-directory }}
          tarball-path: ${{ steps.tarballs.outputs.target }}
          dependency-tarballs: ${{ steps.tarballs.outputs.dependencies }}
          commands: ${{ needs.prepare.outputs.package-tests }}
          test-project: ${{ needs.prepare.outputs.package-test-project }}
      - name: Validate npm publication without publishing
        uses: $/actions/package/publish
        with:
          package-tarball-artifact-id: ${{ matrix.artifactId }}
          dry-run: "true"
          provenance: "false"
          github-token: ""

  package-results:
    name: Report validated packages
    if: ${{ !cancelled() && needs.package-validation.result == 'success' }}
    needs: [package-manifests, package-validation]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      artifact-id: ${{ needs.package-manifests.outputs.artifact-id }}
      artifacts: ${{ needs.package-manifests.outputs.artifacts }}
    steps:
      - run: echo "All package validations passed."
