name: P2.1 controlled scheduling validation

on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        options:
          [
            benchmark,
            preparation-failure,
            build-failure,
            lint-failure,
            test-failure,
            missing-directory,
            disabled,
          ]
        default: benchmark
      container:
        description: Immutable fixture image digest
        type: string
        required: true

permissions: {}

jobs:
  baseline:
    if: inputs.scenario == 'benchmark'
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@aaab44d37f5f675dc6789ea377ffc5b63cc3fe0f
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      container: ${{ inputs.container }}
      working-directory: /usr/src/app
      build: ""
      code-ql: ""
      dependency-review: false
      test: '{"coverage":""}'

  candidate:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@40b3b81d5774c44b82662dfdf63f1bfe63d1351e
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      checks: ${{ inputs.scenario != 'disabled' }}
      container: ${{ inputs.container }}
      working-directory: ${{ inputs.scenario == 'missing-directory' && '/not-mounted/application' || '/usr/src/app' }}
      build: ${{ inputs.scenario == 'preparation-failure' && '{"commands":false}' || inputs.scenario == 'build-failure' && 'does-not-exist' || '' }}
      code-ql: ""
      dependency-review: false
      lint: ${{ inputs.scenario == 'lint-failure' && '{"command":"does-not-exist"}' || 'true' }}
      test: ${{ inputs.scenario == 'test-failure' && '{"command":"does-not-exist","coverage":""}' || '{"coverage":""}' }}
