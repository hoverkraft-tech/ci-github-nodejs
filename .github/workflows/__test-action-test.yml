name: Internal - Tests for test action

on:
  workflow_call:

permissions: {}

jobs:
  test-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    name: Validate native test outputs
    steps:
      - name: Arrange - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Arrange - Create a dependency-free native test project
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            await io.mkdirP('report-fixture');
            await io.cp('.node-version', 'report-fixture/.node-version');
            fs.writeFileSync('report-fixture/package.json', JSON.stringify({
              name: 'report-fixture', version: '1.0.0', private: true,
              scripts: {
                    'test:ci': 'node --experimental-test-coverage --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="$CI_REPORTS_DIR/junit.xml" --test-reporter=lcov --test-reporter-destination="$CI_REPORTS_DIR/lcov.info" test.cjs',
                'test:no-reports': 'node --test test.cjs',
              },
            }));
            fs.writeFileSync('report-fixture/source.cjs', 'module.exports = value => value;\n');
            fs.writeFileSync('report-fixture/test.cjs', "require('node:test').test('report fixture', () => require('node:assert/strict').equal(require('./source.cjs')(process.env.EXPECT_FAILURE), 'false'));\n");
            await exec.exec('npm', ['install', '--package-lock-only', '--ignore-scripts', '--no-audit', '--no-fund'], { cwd: 'report-fixture' });
      - name: Act - Run tests with comments disabled and no write token
        id: test
        uses: $/actions/test
        env:
          EXPECT_FAILURE: "false"
        with:
          working-directory: report-fixture
          command: test:ci
          coverage: "true"
          test-results: junit.xml
          test-coverage: lcov.info
      - name: Assert - Retrieve reports even after a failed test
        if: steps.test.outputs.report-artifact-id != ''
        uses: hoverkraft-tech/ci-github-common/actions/download-artifact@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
        with:
          artifact-ids: ${{ steps.test.outputs.report-artifact-id }}
          path: downloaded-reports
          merge-multiple: true
      - name: Assert - Verify outcome and native report content
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const result = JSON.parse(fs.readFileSync('downloaded-reports/result.json', 'utf8'));
            assert.equal(result.outcome, 'success');
            assert.deepEqual(result.errors, []);
            assert.equal(result.assets.filter(item => item.selector.kind === 'test').length, 1);
            assert.equal(result.assets.filter(item => item.selector.kind === 'coverage').length, 1);
            assert.match(fs.readFileSync('downloaded-reports/reports/junit.xml', 'utf8'), /<testcase/);
            assert.match(fs.readFileSync('downloaded-reports/reports/lcov.info', 'utf8'), /SF:/);
