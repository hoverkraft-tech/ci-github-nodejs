name: Internal - Tests for lint action

on:
  workflow_call:

permissions: {}

jobs:
  lint-report:
    name: Validate native lint outputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Arrange - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Arrange - Create a dependency-free lint project
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            await io.mkdirP('lint-fixture');
            await io.cp('.node-version', 'lint-fixture/.node-version');
            fs.writeFileSync('lint-fixture/package.json', JSON.stringify({
              name: 'lint-fixture', version: '1.0.0', private: true,
              scripts: { 'lint:ci': 'node lint.cjs' },
            }));
            fs.writeFileSync('lint-fixture/lint.cjs', `
              require('node:fs').writeFileSync('command-ran.txt', 'lint ran');
              if (process.env.WRITE_REPORT === 'true') {
                require('node:fs').writeFileSync(process.env.CI_REPORTS_DIR + '/eslint-report.json', JSON.stringify([
                  { filePath: 'src/index.js', messages: [], errorCount: 0, warningCount: 0 },
                ]));
              }
              process.exit(process.env.EXPECT_FAILURE === 'true' ? 1 : 0);
            `);
            await exec.exec('npm', ['install', '--package-lock-only', '--ignore-scripts', '--no-audit', '--no-fund'], { cwd: 'lint-fixture' });
      - name: Act - Run lint with report configuration
        id: lint
        uses: $/actions/lint
        env:
          WRITE_REPORT: "true"
          EXPECT_FAILURE: "false"
        with:
          working-directory: lint-fixture
          lint-results: eslint-report.json
      - name: Assert - Verify the action outcome
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ steps.lint.outputs.report-artifact-id }}
        with:
          script: |
            const assert = require('node:assert/strict');
            assert.match(process.env.ARTIFACT_ID, /^[1-9][0-9]*$/);
            assert.equal(require('node:fs').readFileSync('lint-fixture/command-ran.txt', 'utf8'), 'lint ran');
