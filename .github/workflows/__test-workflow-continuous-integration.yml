name: Internal - Test Continuous integration workflow

on:
  workflow_call:

permissions: {}

jobs:
  act-without-build:
    name: Act - Run contract tests without a build
    uses: $/.github/workflows/continuous-integration.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: tests/continuous-integration
      build: ""
      lint: ""
      code-ql: ""
      dependency-review: false
      test: '{"coverage":""}'

  act-with-checks-disabled:
    name: Act - Disable all application checks without starting a container
    uses: $/.github/workflows/continuous-integration.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      checks: false
      container: invalid.example.invalid/must-not-be-pulled:latest
      working-directory: /unmounted/application

  assert-without-build:
    name: Assert - Disabled builds produce no artifact
    needs: [act-without-build, act-with-checks-disabled]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          BUILD_ARTIFACT: ${{ needs.act-without-build.outputs.build-artifact-id }}
          DISABLED_ARTIFACT: ${{ needs.act-with-checks-disabled.outputs.build-artifact-id }}
        run: |
          test -z "$BUILD_ARTIFACT"
          test -z "$DISABLED_ARTIFACT"

  act-package-without-build:
    name: Act - Validate a source package without a build
    uses: $/.github/workflows/continuous-integration.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: tests/npm
      build: ""
      lint: ""
      test: ""
      code-ql: ""
      dependency-review: false
      package: true
      package-tests: |
        tar -tf "$PACKAGE_TARBALL_PATH" | grep '^package/src/index.js$'

  assert-package-without-build:
    name: Assert - Packaging runs when compilation is omitted
    needs: act-package-without-build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          PACKAGE_ARTIFACT: ${{ needs.act-package-without-build.outputs.package-tarball-artifact-id }}
          BUILD_ARTIFACT: ${{ needs.act-package-without-build.outputs.build-artifact-id }}
        run: |
          test -n "$PACKAGE_ARTIFACT"
          test -z "$BUILD_ARTIFACT"

  act-without-container:
    name: Act - Run the continuous integration workflow (without container)
    uses: $/.github/workflows/continuous-integration.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: tests/npm
      package: true
      package-tests: |
        tar -xOf "$PACKAGE_TARBALL_PATH" package/dist/test.txt > "$RUNNER_TEMP/package-build.txt"
        test "$(cat "$RUNNER_TEMP/package-build.txt")" = 'build test'
        test "$PACKAGE_NAME" = test-for-ci-with-npm
        consumer=$(mktemp -d)
        npm install --prefix "$consumer" --ignore-scripts --offline --no-audit --no-fund "$PACKAGE_TARBALL_PATH"
        test -f "$consumer/node_modules/$PACKAGE_NAME/dist/test.txt"
      code-ql: |
        {
          "languages": "javascript-typescript",
          "config-file": "tests/npm/codeql-config.yml"
        }
      build: |
        {
          "artifact": "dist"
        }

  assert-without-container:
    name: Assert - Ensure build artifact has been uploaded (without container)
    runs-on: ubuntu-latest
    needs: act-without-container
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.act-without-container.outputs.build-artifact-id }}
          path: "/"

      - name: Check the build artifacts
        run: test -f tests/npm/dist/test.txt

      - name: Act - Consume the validated CI package without repacking
        id: validated-package
        uses: $/actions/package/publish
        with:
          package-tarball-artifact-id: ${{ needs.act-without-container.outputs.package-tarball-artifact-id }}
          name: test-for-ci-with-npm
          version: 0.1.0
          dry-run: "true"
          provenance: "false"
      - name: Assert - The CI package contains the compiled output
        env:
          TARBALL: ${{ steps.validated-package.outputs.package-tarball-path }}
        run: |
          tar -xOf "$TARBALL" package/dist/test.txt > "$RUNNER_TEMP/ci-packaged-build.txt"
          cmp tests/npm/dist/test.txt "$RUNNER_TEMP/ci-packaged-build.txt"

      - name: Arrange packaging hooks that must not run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const directory = path.join(process.env.RUNNER_TEMP, 'prepared-fixture');
            await io.mkdirP(path.join(directory, 'dist'));
            await io.cp('tests/npm/dist/test.txt', path.join(directory, 'dist/test.txt'));
            const scripts = Object.fromEntries(['preinstall', 'postinstall', 'prepack', 'prepare', 'postpack'].map(name => [name, 'node -e "process.exit(1)"']));
            fs.writeFileSync(path.join(directory, 'package.json'), JSON.stringify({ name: 'prepared-fixture', version: '1.2.3', files: ['dist'], scripts, dependencies: { 'must-not-install': 'file:./missing' } }));
      - id: fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/prepared-fixture
          name: prepared-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
      - name: Arrange - Configure the package runtime
        uses: $/actions/setup-node
        with:
          working-directory: tests/npm
          install-dependencies: "false"
      - name: Package existing build output without installing or rebuilding
        id: package
        uses: $/actions/package/create
        with:
          working-directory: tests/npm
          build-artifact-id: ${{ steps.fixture.outputs.artifact-id }}
          build-artifact-path: ${{ github.workspace }}/tests/npm
      - name: Verify compiled output is unchanged and dependencies were not installed
        env:
          TARBALL: ${{ steps.package.outputs.package-tarball-path }}
        run: |
          tar -xOf "$TARBALL" package/dist/test.txt > "$RUNNER_TEMP/packaged-build.txt"
          cmp "$RUNNER_TEMP/prepared-fixture/dist/test.txt" "$RUNNER_TEMP/packaged-build.txt"
          test ! -d tests/npm/node_modules
      - name: Run package smoke checks with the project runtime
        uses: $/actions/package/test
        with:
          working-directory: tests/npm
          tarball-path: ${{ steps.package.outputs.package-tarball-path }}
          commands: |
            node <<'NODE'
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const expected = fs.readFileSync('.node-version', 'utf8').trim().split('.');
            assert.deepEqual(process.versions.node.split('.').slice(0, expected.length), expected);
            NODE
            test "$PACKAGE_NAME" = prepared-fixture
            test "$PACKAGE_VERSION" = 1.2.3
            tar -xOf "$PACKAGE_TARBALL_PATH" package/dist/test.txt > "$RUNNER_TEMP/smoke-output.txt"
            cmp "$RUNNER_TEMP/prepared-fixture/dist/test.txt" "$RUNNER_TEMP/smoke-output.txt"
      - name: Validate publishing the prepared tarball
        uses: $/actions/package/publish
        with:
          package-tarball-artifact-id: ${{ steps.package.outputs.package-tarball-artifact-id }}
          dry-run: "true"
          provenance: "false"

  act-without-container-and-github-reports:
    # jscpd:ignore-start
    name: Act - Run the continuous integration workflow (without container and GitHub reports)
    uses: $/.github/workflows/continuous-integration.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: tests/npm
      ignore-scripts: false
      code-ql: typescript
      build: |
        {
          "artifact": "dist"
        }
      test: |
        {"coverage": "github"}
    # jscpd:ignore-end

  assert-package-disabled:
    name: Assert - Package creation is opt-in
    needs: act-without-container-and-github-reports
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          PACKAGE_ARTIFACT_ID: ${{ needs.act-without-container-and-github-reports.outputs.package-tarball-artifact-id }}
        run: test -z "$PACKAGE_ARTIFACT_ID"

  arrange-with-container:
    name: Arrange - Build container image for CI workflow
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@5ffc3c81daacc57700a14bb91d67edbc67eedc1d # 0.39.0
    with:
      sign: false
      attest: false
      images: |
        [{
          "name": "ci-npm",
          "context": ".",
          "dockerfile": "./tests/npm/Dockerfile",
          "build-args": { "APP_PATH": "./tests/npm/" },
          "target": "ci",
          "platforms": ["linux/amd64"]
        }]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  act-with-container:
    name: Act - Run the continuous integration workflow (with container)
    uses: $/.github/workflows/continuous-integration.yml
    needs: arrange-with-container
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      container: ${{ fromJSON(needs.arrange-with-container.outputs.built-images).ci-npm.images[0] }}
      working-directory: /usr/src/app/
      build: |
        {
          "artifact": "dist"
        }
      test: |
        {"coverage": "codecov"}

  act-with-container-without-build:
    name: Act - Run container checks without a build
    uses: $/.github/workflows/continuous-integration.yml
    needs: arrange-with-container
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      container: ${{ fromJSON(needs.arrange-with-container.outputs.built-images).ci-npm.images[0] }}
      working-directory: /usr/src/app/
      build: ""
      code-ql: ""
      dependency-review: false
      test: '{"coverage":""}'

  assert-with-container:
    name: Assert - Ensure build artifact has been uploaded (with container)
    runs-on: ubuntu-latest
    needs: act-with-container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.act-with-container.outputs.build-artifact-id }}
          path: ${{ runner.temp }}

      - name: Check the build artifacts
        run: test -f ${{ runner.temp }}/usr/src/app/dist/test.txt

  act-with-container-advanced:
    name: Act - Run the continuous integration workflow (with container and advanced options)
    uses: $/.github/workflows/continuous-integration.yml
    needs: arrange-with-container
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      code-ql: '{"languages":"typescript"}'
      container: |
        {
          "image": "${{ fromJSON(needs.arrange-with-container.outputs.built-images).ci-npm.images[0] }}",
          "env": {
            "NODE_ENV": "test",
            "CI": "true"
          },
          "options": "--cpus 1",
          "credentials": {
            "username": "${{ github.actor }}"
          }
        }
      working-directory: /usr/src/app/
      build: |
        {
          "artifact": "dist"
        }
      test: |
        {"coverage": "codecov"}
    secrets:
      container-password: ${{ secrets.GITHUB_TOKEN }}

  assert-with-container-advanced:
    # jscpd:ignore-start
    name: Assert - Ensure build artifact has been uploaded (with container advanced)
    runs-on: ubuntu-latest
    needs: act-with-container-advanced
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.act-with-container-advanced.outputs.build-artifact-id }}
          path: ${{ runner.temp }}

      - name: Check the build artifacts
        run: test -f ${{ runner.temp }}/usr/src/app/dist/test.txt
    # jscpd:ignore-end
