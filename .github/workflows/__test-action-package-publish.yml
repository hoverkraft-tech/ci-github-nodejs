name: Internal - Tests for "package/publish" action

on:
  workflow_call:

permissions: {}

jobs:
  package:
    name: Arrange package tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-tarball-artifact-id: ${{ steps.package.outputs.package-tarball-artifact-id }}
      published-version-artifact-id: ${{ steps.published-version.outputs.package-tarball-artifact-id }}
    steps:
      - name: Arrange - Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arrange - Configure the package runtime
        uses: $/actions/setup-node
        with:
          working-directory: tests/npm
          install-dependencies: "false"

      - id: package
        name: Arrange - Create package tarball
        uses: $/actions/package/create
        with:
          working-directory: tests/npm

      - id: published-fixture
        name: Arrange - Use an existing npm name and version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { stdout } = await exec.getExecOutput('npm', ['--version'], { silent: true });
            const version = stdout.trim();
            const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'published-version-'));
            fs.writeFileSync(path.join(directory, 'package.json'), JSON.stringify({ name: 'npm', version, packageManager: `npm@${version}` }));
            core.setOutput('directory', directory);
      - id: published-version
        name: Arrange - Pack the existing-version fixture
        uses: $/actions/package/create
        with:
          working-directory: ${{ steps.published-fixture.outputs.directory }}

  publish:
    name: Publish dry run (${{ matrix.os }}, ${{ matrix.tag || 'default tag' }})
    needs: package
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        tag: ["", next]
    steps:
      - name: Arrange - Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Act - Run "package/publish" action
        uses: $/actions/package/publish
        with:
          package-tarball-artifact-id: ${{ needs.package.outputs.package-tarball-artifact-id }}
          tag: ${{ matrix.tag }}
          access: ${{ matrix.tag == 'next' && 'restricted' || 'public' }}
          dry-run: "true"
          provenance: "false"

      - name: Act - Validate an already-published version without publishing
        uses: $/actions/package/publish
        with:
          package-tarball-artifact-id: ${{ needs.package.outputs.published-version-artifact-id }}
          dry-run: "true"
          provenance: "false"

      - id: invalid-artifact
        name: Act - Reject multiple artifact IDs
        continue-on-error: true
        uses: $/actions/package/publish
        with:
          package-tarball-artifact-id: "1,2"
          dry-run: "true"
          provenance: "false"

      - id: invalid-dry-run
        name: Act - Reject invalid dry-run input
        continue-on-error: true
        uses: $/actions/package/publish
        with:
          package-tarball-artifact-id: ${{ needs.package.outputs.package-tarball-artifact-id }}
          dry-run: "yes"
          provenance: "false"

      - id: wrong-identity
        name: Act - Reject an unintended release package
        continue-on-error: true
        uses: $/actions/package/publish
        with:
          package-tarball-artifact-id: ${{ needs.package.outputs.package-tarball-artifact-id }}
          name: another-package
          version: 0.1.0
          dry-run: "true"
          provenance: "false"

      - name: Assert - Invalid inputs fail before publishing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INVALID_ARTIFACT_OUTCOME: ${{ steps.invalid-artifact.outcome }}
          WRONG_IDENTITY_OUTCOME: ${{ steps.wrong-identity.outcome }}
          INVALID_DRY_RUN_OUTCOME: ${{ steps.invalid-dry-run.outcome }}
        with:
          script: |
            for (const outcome of [process.env.INVALID_ARTIFACT_OUTCOME, process.env.INVALID_DRY_RUN_OUTCOME, process.env.WRONG_IDENTITY_OUTCOME]) {
              if (outcome !== 'failure') {
                core.setFailed('Expected invalid publish inputs to fail');
              }
            }
