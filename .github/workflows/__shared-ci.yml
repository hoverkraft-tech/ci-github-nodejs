name: Internal - Common Continuous Integration tasks

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: linter
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@2fa562bd44f9e752a99a374c85ae14644e7f2bdd # 4.2.2
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      comment: false

  test-release:
    name: Test release preparation and recovery
    uses: $/.github/workflows/__test-release.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  test-action-dependencies-cache:
    name: Test action "dependencies-cache"
    needs: lint
    uses: $/.github/workflows/__test-action-dependencies-cache.yml
    permissions:
      contents: read

  test-action-get-package-manager:
    name: Test action "get-package-manager"
    needs: lint
    uses: $/.github/workflows/__test-action-get-package-manager.yml
    permissions:
      contents: read

  test-action-has-installed-dependencies:
    name: Test action "has-installed-dependencies"
    needs: lint
    uses: $/.github/workflows/__test-action-has-installed-dependencies.yml
    permissions:
      contents: read

  test-action-package-create:
    name: Test action "package/create"
    needs: lint
    uses: $/.github/workflows/__test-action-package-create.yml
    permissions:
      contents: read

  test-action-package-test:
    name: Test action "package/test"
    needs: lint
    uses: $/.github/workflows/__test-action-package-test.yml
    permissions:
      contents: read

  test-action-package-discover:
    name: Test action "package/discover"
    needs: lint
    uses: $/.github/workflows/__test-action-package-discover.yml
    permissions:
      contents: read

  test-action-setup-node:
    name: Test action "setup-node"
    needs: lint
    uses: $/.github/workflows/__test-action-setup-node.yml
    permissions:
      contents: read

  test-action-package-publish:
    name: Test action "package/publish"
    needs: lint
    uses: $/.github/workflows/__test-action-package-publish.yml
    permissions:
      actions: read
      contents: read

  test-workflow-continuous-integration:
    name: Test workflow "continuous-integration"
    needs: lint
    uses: $/.github/workflows/__test-workflow-continuous-integration.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      packages: write
      pull-requests: write
      id-token: write
      issues: read
      security-events: write

  test-action-test:
    needs: lint
    uses: $/.github/workflows/__test-action-test.yml
    permissions:
      contents: read

  test-action-lint:
    needs: lint
    uses: $/.github/workflows/__test-action-lint.yml
    permissions:
      contents: read

  reports:
    needs: [lint, test-release]
    if: always()
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@2fa562bd44f9e752a99a374c85ae14644e7f2bdd # 4.2.2
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
