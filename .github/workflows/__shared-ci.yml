name: Internal - Common Continuous Integration tasks

on:
  workflow_call:

permissions: {}

jobs:
  test-release:
    name: Test release preparation and recovery
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/actions/setup-node
        with:
          working-directory: tests/release
      - run: npm test
        working-directory: tests/release

  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  test-action-dependencies-cache:
    name: Test action "dependencies-cache"
    needs: linter
    uses: $/.github/workflows/__test-action-dependencies-cache.yml
    permissions:
      contents: read

  test-action-get-package-manager:
    name: Test action "get-package-manager"
    needs: linter
    uses: $/.github/workflows/__test-action-get-package-manager.yml
    permissions:
      contents: read

  test-action-has-installed-dependencies:
    name: Test action "has-installed-dependencies"
    needs: linter
    uses: $/.github/workflows/__test-action-has-installed-dependencies.yml
    permissions:
      contents: read

  test-action-package:
    name: Test action "package"
    needs: linter
    uses: $/.github/workflows/__test-action-package.yml
    permissions:
      contents: read

  test-action-setup-node:
    name: Test action "setup-node"
    needs: linter
    uses: $/.github/workflows/__test-action-setup-node.yml
    permissions:
      contents: read

  test-action-publish:
    name: Test action "publish"
    needs: linter
    uses: $/.github/workflows/__test-action-publish.yml
    permissions:
      actions: read
      contents: read

  test-workflow-continuous-integration:
    name: Test workflow "continuous-integration"
    needs: linter
    uses: $/.github/workflows/__test-workflow-continuous-integration.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      packages: write
      pull-requests: write
      id-token: write
      issues: read
      security-events: write
