name: Restore published Node.js package
description: Check an exact npm version and restore its original tarball with integrity verification when resuming publication.
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  name:
    description: Expected npm package name.
    required: true
  version:
    description: Expected committed package version.
    required: true
  tarball-path:
    description: Local tarball path to replace with the original published bytes on recovery.
    required: true
outputs:
  published:
    description: Whether the exact version already exists on npm and its tarball was restored.
    value: ${{ steps.restore.outputs.published }}
runs:
  using: composite
  steps:
    - id: restore
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        PACKAGE_NAME: ${{ inputs.name }}
        PACKAGE_VERSION: ${{ inputs.version }}
        TARBALL_PATH: ${{ inputs.tarball-path }}
      with:
        script: |
          const { ReleaseArtifacts } = require(`${process.env.ACTION_PATH}/../ReleaseArtifacts.js`);
          const published = await new ReleaseArtifacts().restorePackage({ name: process.env.PACKAGE_NAME, version: process.env.PACKAGE_VERSION, tarballPath: process.env.TARBALL_PATH });
          core.setOutput('published', String(published));
