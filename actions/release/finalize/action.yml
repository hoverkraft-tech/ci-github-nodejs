name: Finalize Node.js release
description: Verify published npm tarballs against release assets, then stage only missing files and publish the draft with HoverKraft release/update using GITHUB_TOKEN.
author: hoverkraft
branding:
  icon: tag
  color: blue
inputs:
  tag:
    description: Committed release tag.
    required: true
  package-tarball-path:
    description: Local tarball path returned by package/publish, or a glob matching downloaded workspace tarballs. Use the original npm bytes restored during recovery.
    required: true
  asset-name:
    description: Plain .tgz filename for a single tarball. Leave empty to preserve matched tarball filenames.
    default: ""
runs:
  using: composite
  steps:
    - id: assets
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        RELEASE_TAG: ${{ inputs.tag }}
        PACKAGE_TARBALL_PATH: ${{ inputs.package-tarball-path }}
        ASSET_NAME: ${{ inputs.asset-name }}
        RUNNER_TEMP: ${{ runner.temp }}
      with:
        script: |
          const releaseAssets = require(`${process.env.ACTION_PATH}/index.js`);
          const { release, pendingDirectory, hasAssets } = await releaseAssets.prepareAssets({
            github, glob, repo: context.repo, tag: process.env.RELEASE_TAG,
            tarballPath: process.env.PACKAGE_TARBALL_PATH, assetName: process.env.ASSET_NAME,
            tempDirectory: process.env.RUNNER_TEMP,
          });
          core.setOutput('release-id', release.id);
          core.setOutput('published', String(!release.draft));
          core.setOutput('pending-directory', pendingDirectory);
          core.setOutput('has-assets', String(hasAssets));
    - id: pending-assets
      if: steps.assets.outputs.has-assets == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-pending-assets-${{ steps.assets.outputs.release-id }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.assets.outputs.pending-directory }}/*.tgz
        if-no-files-found: error
    - uses: hoverkraft-tech/ci-github-publish/actions/release/update@78a540b1bf0b18dd2f160c98943f61eefb03e8b9 # 3.0.4
      if: steps.assets.outputs.published != 'true'
      with:
        tag: ${{ inputs.tag }}
        publish: "true"
        release-artifact-id: ${{ steps.pending-assets.outputs.artifact-id }}
