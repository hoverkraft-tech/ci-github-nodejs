name: Finalize Node.js release
description: Attach published npm tarballs without overwriting existing assets, publish the draft and mark its release PR as released.
author: hoverkraft
branding:
  icon: tag
  color: blue
inputs:
  tag:
    description: Committed release tag.
    required: true
  asset-directory:
    description: Directory containing the published npm tarballs.
    required: true
  versioning:
    description: Version preparation tool, release-please or lerna.
    default: release-please
  github-token:
    description: Token with contents and issues write permissions.
    default: ${{ github.token }}
outputs:
  url:
    description: Published GitHub release URL.
    value: ${{ steps.assets.outputs.url }}
runs:
  using: composite
  steps:
    - id: assets
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        RELEASE_TAG: ${{ inputs.tag }}
        ASSET_DIRECTORY: ${{ inputs.asset-directory }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { ReleaseArtifacts } = require(`${process.env.ACTION_PATH}/../ReleaseArtifacts.js`);
          const release = await new ReleaseArtifacts().attachAssets({ github, repo: context.repo, tag: process.env.RELEASE_TAG, directory: process.env.ASSET_DIRECTORY });
          core.setOutput('url', release.html_url);
          core.setOutput('published', String(!release.draft));
    - uses: hoverkraft-tech/ci-github-publish/actions/release/update@ea6682de88070c254dac619a6623a242a6d57cd3 # 1.0.3
      if: steps.assets.outputs.published != 'true'
      with:
        tag: ${{ inputs.tag }}
        publish: "true"
        github-token: ${{ inputs.github-token }}
    - name: Complete release PR
      if: inputs.versioning == 'release-please'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { ReleaseArtifacts } = require(`${process.env.ACTION_PATH}/../ReleaseArtifacts.js`);
          await new ReleaseArtifacts().markReleaseRequests({ github, context });
