name: Prepare Node.js package release
description: Prepare Conventional Commit versions with HoverKraft and npm or Lerna, then dispatch publication from the committed tag.
author: hoverkraft
branding:
  icon: git-commit
  color: blue
inputs:
  release-config:
    description: |
      Optional partial release configuration as a YAML or JSON mapping, forwarded to ci-github-publish/actions/release/plan.
      See https://github.com/hoverkraft-tech/ci-github-publish/tree/main/actions/release/plan for supported settings and override behavior.
      Pass the same configuration to the release workflow. Independent Lerna retains native version planning.
    default: ""
  versioning:
    description: Versioning tool, npm for one public package or lerna for fixed or independent workspaces.
    default: npm
  working-directory:
    description: Project or workspace root containing the lockfile and package manager configuration.
    default: .
  package-directory:
    description: Public npm package directory relative to working-directory. Leave as . for a single root package or Lerna workspaces.
    default: .
  force:
    description: Force a new version on manual default-branch runs, including unchanged public packages. Uses a patch bump when no version increase is planned. Ignored for schedules and tag recovery.
    default: "false"
  github-token:
    description: Token with contents and actions write and pull-requests read permissions. Its identity must be allowed to push release commits and tags.
    default: ${{ github.token }}
outputs:
  status:
    description: One of no-changes, dispatched, ready or released. Only ready should start building, followed by publication.
    value: ${{ steps.existing.outputs.status || (steps.dispatch.outcome == 'success' && 'dispatched') || 'no-changes' }}
  packages:
    description: JSON array of public packages at the committed release version, with name, version, tag, directory and slug.
    value: ${{ steps.existing.outputs.packages || '[]' }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ inputs.github-token }}
        persist-credentials: true
    - name: Inspect release project and existing tag
      id: inspect
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        VERSIONING: ${{ inputs.versioning }}
        PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        FORCE_RELEASE: ${{ inputs.force }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { ReleaseProject } = require(`${process.env.ACTION_PATH}/ReleaseProject.js`);
          const project = new ReleaseProject({ workspace: process.env.GITHUB_WORKSPACE, workingDirectory: process.env.WORKING_DIRECTORY, packageDirectory: process.env.PACKAGE_DIRECTORY, versioning: process.env.VERSIONING, force: process.env.FORCE_RELEASE === 'true', context, exec });
          core.setOutput('tag', (await project.currentTag()) || '');
          core.setOutput('independent', String(project.independent));
          core.setOutput('force', String(project.force));
          if (!context.ref.startsWith('refs/tags/')) {
            const prefix = `${context.repo.owner}/${context.repo.repo}/`;
            const workflow = process.env.CALLER_WORKFLOW_REF?.startsWith(prefix) ? process.env.CALLER_WORKFLOW_REF.slice(prefix.length).split('@')[0] : '';
            if (!/^\.github\/workflows\/[^/]+\.ya?ml$/.test(workflow)) throw new Error('Cannot determine the caller workflow for publication dispatch.');
            core.setOutput('workflow', workflow);
          }
    - name: Plan release with HoverKraft
      id: plan
      if: steps.inspect.outputs.tag == '' && steps.inspect.outputs.independent != 'true'
      uses: hoverkraft-tech/ci-github-publish/actions/release/plan@704e6c786af0f5dfd84a8851e428bb36b6cf180f # 3.0.1
      with:
        github-token: ${{ inputs.github-token }}
        target-ref: ${{ github.sha }}
        config-overrides: ${{ inputs.release-config }}
        working-directory: ${{ inputs.working-directory != '.' && inputs.working-directory || '' }}
    - name: Restore source checkout for version preparation
      if: steps.plan.outputs.should-release == 'true' || steps.inspect.outputs.force == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ inputs.github-token }}
        persist-credentials: true
    - uses: $/actions/setup-node
      if: steps.plan.outputs.should-release == 'true' || steps.inspect.outputs.force == 'true' || inputs.versioning == 'lerna'
      with:
        working-directory: ${{ inputs.working-directory }}
        ignore-scripts: "true"
    - name: Inspect existing package releases
      id: existing
      if: steps.inspect.outputs.tag != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        VERSIONING: ${{ inputs.versioning }}
        PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        RELEASE_TAG: ${{ steps.inspect.outputs.tag }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { ReleaseProject } = require(`${process.env.ACTION_PATH}/ReleaseProject.js`);
          const githubRelease = require(`${process.env.ACTION_PATH}/index.js`);
          const project = new ReleaseProject({ workspace: process.env.GITHUB_WORKSPACE, workingDirectory: process.env.WORKING_DIRECTORY, packageDirectory: process.env.PACKAGE_DIRECTORY, versioning: process.env.VERSIONING, context, exec });
          const packages = await project.packages(process.env.RELEASE_TAG);
          const tags = [...new Set(packages.map(item => item.tag))];
          const releases = await Promise.all(tags.map(tag => githubRelease.findRelease(github, context.repo, tag)));
          if (context.ref.startsWith('refs/tags/')) {
            core.setOutput('status', 'ready');
            core.setOutput('packages', packages);
          } else if (releases.every(release => release && !release.draft)) {
            core.setOutput('status', 'released');
          }
    - name: Start version preparation from the planned source
      id: source
      if: steps.inspect.outputs.tag == '' && (steps.plan.outputs.should-release == 'true' || steps.inspect.outputs.independent == 'true' || steps.inspect.outputs.force == 'true')
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        git switch --force-create "$DEFAULT_BRANCH" "$GITHUB_SHA"
        if [ -n "$(git status --porcelain)" ]; then
          echo "Release source must be clean before applying the planned version." >&2
          exit 1
        fi
    - name: Apply package versions with npm or Lerna
      id: version
      if: steps.inspect.outputs.tag == '' && (steps.plan.outputs.should-release == 'true' || steps.inspect.outputs.independent == 'true' || steps.inspect.outputs.force == 'true')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        VERSIONING: ${{ inputs.versioning }}
        PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        FORCE_RELEASE: ${{ steps.inspect.outputs.force }}
      with:
        script: |
          const { ReleaseProject } = require(`${process.env.ACTION_PATH}/ReleaseProject.js`);
          const project = new ReleaseProject({ workspace: process.env.GITHUB_WORKSPACE, workingDirectory: process.env.WORKING_DIRECTORY, packageDirectory: process.env.PACKAGE_DIRECTORY, versioning: process.env.VERSIONING, force: process.env.FORCE_RELEASE === 'true', context, exec });
          const result = project.independent ? await project.prepareIndependent() : await project.prepareVersion({ tag: process.env.RELEASE_TAG });
          core.setOutput('tag', result.tag || '');
          core.setOutput('tags', result.tags || []);
    - name: Push the signed release commit and tags atomically
      id: commit
      if: steps.version.outputs.tag != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        RELEASE_TAGS: ${{ steps.version.outputs.tags }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('node:path');
          const { pushRelease } = require(`${process.env.ACTION_PATH}/index.js`);
          const directory = path.resolve(process.env.GITHUB_WORKSPACE, process.env.WORKING_DIRECTORY);
          await exec.exec('git', ['add', '--all', '--', '.'], { cwd: directory });
          await pushRelease({ github, context, exec, directory, tags: JSON.parse(process.env.RELEASE_TAGS) });
    - name: Dispatch the caller at the prepared tag
      id: dispatch
      if: steps.existing.outputs.status == '' && (steps.inspect.outputs.tag != '' || steps.version.outputs.tag != '')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CALLER_WORKFLOW: ${{ steps.inspect.outputs.workflow }}
        RELEASE_TAG: ${{ steps.inspect.outputs.tag || steps.version.outputs.tag }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: process.env.CALLER_WORKFLOW, ref: process.env.RELEASE_TAG });
