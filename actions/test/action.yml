name: "Test"
description: |
  Action to test Node.js projects with support for coverage reporting and pull request annotations

  GitHub reporting retains native report artifacts for seven days, including after
  test failures. Set `comment: false` and call the common `ci-reports` workflow
  after test jobs to publish one test comment and one coverage comment.

  Note that this action must have write permission for id-token for this to work when using Codecov coverage reporting:

  ```yml
  permissions:
    id-token: write
  ```

  Native `coverage: github-code-quality` prepares Cobertura artifacts for the common
  [CI reports workflow](https://github.com/hoverkraft-tech/ci-github-common/blob/main/.github/workflows/ci-reports.md)
  and its opt-in publication workflow. Set `report-group` to the outer calling job
  and list every expected component in the collector. The default label is the
  repository-relative working directory, or `root`. Multiple reports need explicit
  stable labels. Reports must measure the PR head commit, not the PR merge commit.
  Keep merge-result validation separately when required. No upload permission is
  needed in this test action; only the publication job needs `code-quality: write`.
author: hoverkraft
branding:
  icon: check-square
  color: blue

inputs:
  ignore-scripts:
    description: |
      Disable project and dependency lifecycle scripts during installation.
      Set false to allow installation hooks, subject to the package manager's script approval settings.
      Explicit commands are unaffected. Does not apply in container mode, which skips installation.
    default: "true"
  working-directory:
    description: |
      Working directory where test commands are executed.
      Can be absolute or relative to the repository root.
    required: false
    default: "."
  container:
    description: "Whether running in container mode (skips checkout and node setup)"
    required: false
    default: "false"
  command:
    description: |
      npm/pnpm/Yarn script command to run for testing.
      This should be a script defined in your `package.json`.
      The command should generate coverage report files in a standard format (Cobertura XML, lcov, etc.).

      Vitest: `vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml --coverage.enabled --coverage.reporter=lcov --coverage.reporter=text`
      Jest: `jest --ci --reporters=default --reporters=jest-junit --coverage`
    required: false
    default: "test:ci"
  coverage-source-sha:
    description: Tested source commit for a prebuilt container without Git metadata. Must equal the PR head or push SHA.
    default: ""
  coverage-source-prefix:
    description: Repository-relative directory represented by the container working-directory. Required with coverage-source-sha when Git metadata is absent; use a dot for the repository root.
    default: ""
  coverage-reports:
    description: |
      Native GitHub coverage reports as a JSON array of file, language and optional label.
      Empty uses coverage/cobertura-coverage.xml; multiple reports require explicit unique labels.
      Every file must be Cobertura XML produced by the test command. Paths are relative
      to working-directory. Example: [{"file":"coverage.xml","language":"JavaScript","label":"backend"}].
    default: ""
  coverage:
    description: |
      Code coverage reporter to use. Supported values:
      - `github`: Parse coverage reports via [parse-ci-reports](https://github.com/hoverkraft-tech/ci-github-common/tree/main/actions/quality/parse-ci-reports) action, with GitHub summaries/PR comments
      - `github-code-quality`: Prepare Cobertura for the common native publication workflow
      - `codecov`: Upload coverage to Codecov
      - `""` or `null`: No coverage reporting
    required: false
    default: "github"
  arguments:
    description: |
      JSON array of arguments passed to the package script without shell expansion.
      npm receives its required `--` separator; pnpm and Yarn receive arguments directly.
    default: "[]"
  shard:
    description: |
      Optional Vitest shard as index/total, for example `1/2`. Requires shard-group.
      Adds native shard/blob arguments, sets CI_TEST_SHARD, and uploads a checked blob payload
      after tests, including failures. Individual reporting is disabled for shards.
      Use reporter-specific --outputFile.junit rather than scalar --outputFile in the package script.
      Keep coverage collection enabled; defer configured coverage thresholds to the merge
      when CI_TEST_SHARD is nonempty. The workflow normally supplies these orchestration inputs.
    default: ""
  shard-group:
    description: |
      Unique artifact group for this project, workflow invocation, run and attempt.
      Use only letters, numbers, underscores and hyphens. Never reuse across attempts.
      All shards and their merge must use the same group and absolute project directory.
    default: ""
  merge-shards:
    description: |
      Optional expected Vitest shard count (2-256). Requires shard-group and excludes shard.
      Downloads this run's matching payloads, validates the complete set and adds --merge-reports.
      The package script must enable final reporters and original coverage thresholds.
      A failed shard remains fatal even if merging succeeds. Partial reruns require a full workflow rerun.
    default: ""
  report-file:
    description: |
      Optional test and coverage report paths forwarded to the [parse-ci-reports](https://github.com/hoverkraft-tech/ci-github-common/tree/main/actions/quality/parse-ci-reports) action.
      Supports multiple formats (Cobertura, OpenCover, lcov, etc.).
      Provide absolute paths or paths relative to the working directory.
      Multiple entries can be separated by newlines, commas, or semicolons.
      Each explicit path or glob must match a file after exclusions; missing reports fail the action.
      When omitted, `auto:test,auto:coverage` detection may find no reports.
      Test reports are collected independently of the coverage destination.
    required: false
    default: ""
  path-mapping:
    description: |
      Optional path mapping to adjust file paths in test and coverage reports.
      See the [parse-ci-reports documentation](https://github.com/hoverkraft-tech/ci-github-common/tree/main/actions/quality/parse-ci-reports) for details.
    required: false
    default: ""
  comment:
    description: Publish an individual coverage PR comment. Set false when using the common ci-reports workflow; GitHub summaries and report artifacts remain enabled.
    default: "true"
  report-group:
    description: |
      Job ID used to associate native reports with the common ci-reports workflow's job-results.
      Defaults to the current job ID. Set the outer calling job ID for nested reusable workflows.
      Matrix runs keep separate artifacts labeled with their working directory.
  github-token:
    description: |
      GitHub token for coverage PR comments.
      Required when coverage is `github` and individual comments are enabled.
      Requires permissions to create and update PR comments:

      - `issues: write`
      - `pull-requests: write`
    required: false
    default: ""

outputs:
  native-coverage-artifact-id:
    description: Cobertura artifact for native GitHub publication, empty unless github-code-quality is selected.
    value: ${{ steps.native-coverage.outputs.artifact-id }}
  report-artifact-id:
    description: Native test and coverage artifact ID, empty when GitHub reports are unavailable.
    value: ${{ steps.upload-reports.outputs.artifact-id }}
  shard-artifact-id:
    description: Blob and manifest artifact ID for an executing shard, including failed tests with a blob.
    value: ${{ steps.upload-shard.outputs.artifact-id }}

runs:
  using: "composite"
  steps:
    # jscpd:ignore-start
    - id: working-directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
      with:
        working-directory: ${{ inputs.working-directory }}
        enforce-path-in-workspace: ${{ inputs.container == 'true' && 'false' || 'true' }}
    # jscpd:ignore-end

    - id: prepare-test
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        NODE_ACTION_PATH: ${{ github.action_path }}
        WORKING_DIRECTORY: ${{ steps.working-directory.outputs.absolute-path }}
        COVERAGE_DESTINATION: ${{ inputs.coverage }}
        TEST_COMMIT: ${{ inputs.coverage == 'github-code-quality' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
        TEST_ARGUMENTS: ${{ inputs.arguments }}
        TEST_SHARD: ${{ inputs.shard }}
        SHARD_GROUP: ${{ inputs.shard-group }}
        MERGE_SHARDS: ${{ inputs.merge-shards }}
      with:
        script: |
          if (!['', 'null', 'github', 'github-code-quality', 'codecov'].includes(process.env.COVERAGE_DESTINATION)) throw new Error('Unsupported coverage destination.');
          const { TestShards } = require(`${process.env.NODE_ACTION_PATH}/TestShards.cjs`);
          const configuration = {
            workingDirectory: process.env.WORKING_DIRECTORY,
            temporaryDirectory: process.env.RUNNER_TEMP,
            group: process.env.SHARD_GROUP,
            shard: process.env.TEST_SHARD,
            mergeShards: process.env.MERGE_SHARDS,
            identity: {
              runId: process.env.GITHUB_RUN_ID,
              attempt: process.env.GITHUB_RUN_ATTEMPT,
              sha: process.env.TEST_COMMIT
            }
          };
          const shards = new TestShards(configuration);
          core.setOutput('arguments', shards.prepare(TestShards.arguments(process.env.TEST_ARGUMENTS)));
          core.setOutput('configuration', configuration);
          core.setOutput('directory', shards.directory || '');
          core.setOutput('payload', shards.index ? shards.payload : '');
          core.setOutput('incoming', shards.incoming || '');
          core.setOutput('group', shards.group || '');

    - id: setup-node
      if: inputs.container != 'true'
      uses: $/actions/setup-node
      with:
        working-directory: ${{ steps.working-directory.outputs.absolute-path }}
        ignore-scripts: ${{ inputs.ignore-scripts }}
        dependencies-cache: |
          nx
          jest
          vitest

    - id: get-package-manager
      if: inputs.container == 'true'
      uses: $/actions/get-package-manager
      with:
        working-directory: ${{ steps.working-directory.outputs.absolute-path }}

    - name: Download shard payloads
      if: inputs.merge-shards != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ steps.prepare-test.outputs.group }}-*
        path: ${{ steps.prepare-test.outputs.incoming }}

    - id: validate-shards
      if: inputs.merge-shards != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        NODE_ACTION_PATH: ${{ github.action_path }}
        SHARD_CONFIGURATION: ${{ steps.prepare-test.outputs.configuration }}
      with:
        script: |
          const { TestShards } = require(`${process.env.NODE_ACTION_PATH}/TestShards.cjs`);
          const shards = new TestShards(JSON.parse(process.env.SHARD_CONFIGURATION));
          core.setOutput('failed', shards.validate());

    - id: run-test
      name: 🧪 Run tests
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        NODE_ACTION_PATH: ${{ github.action_path }}
        RUN_TEST_COMMAND: ${{ inputs.container == 'true' && steps.get-package-manager.outputs.run-script-command || steps.setup-node.outputs.run-script-command }}
        WORKING_DIRECTORY: ${{ steps.working-directory.outputs.absolute-path }}
        TEST_COMMAND: ${{ inputs.command }}
        TEST_ARGUMENTS: ${{ steps.prepare-test.outputs.arguments }}
        TEST_SHARD: ${{ inputs.shard }}
        SHARDS_FAILED: ${{ steps.validate-shards.outputs.failed }}
      with:
        script: |
          const workingDirectory = process.env.WORKING_DIRECTORY;
          core.debug(`Running in working directory: ${workingDirectory}`);
          process.chdir(workingDirectory);

          const runScriptCommand = process.env.RUN_TEST_COMMAND;
          const testCommand = process.env.TEST_COMMAND || 'test:ci';
          const { TestShards } = require(`${process.env.NODE_ACTION_PATH}/TestShards.cjs`);
          const args = TestShards.scriptArguments(runScriptCommand, testCommand, TestShards.arguments(process.env.TEST_ARGUMENTS));

          core.info(`🧪 Running test command: ${testCommand}...`);

          try {
            const exitCode = await exec.exec(runScriptCommand, args, {
              cwd: workingDirectory,
              env: { ...process.env, CI: 'true', CI_TEST_SHARD: process.env.TEST_SHARD || '' },
              ignoreReturnCode: true
            });

            core.setOutput('test-exit-code', exitCode);

            if (exitCode !== 0) {
              core.setFailed(`Tests failed with exit code ${exitCode}`);
            } else if (process.env.SHARDS_FAILED === 'true') {
              core.setFailed('One or more test shards failed, even though report merging succeeded.');
            }
          } catch (error) {
            core.setOutput('test-exit-code', 1);
            core.setFailed(`Test execution error: ${error.message}`);
          }

    - name: Record shard payload
      id: shard-payload
      if: always() && inputs.shard != '' && steps.prepare-test.outputs.payload != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        NODE_ACTION_PATH: ${{ github.action_path }}
        SHARD_CONFIGURATION: ${{ steps.prepare-test.outputs.configuration }}
        TEST_EXIT_CODE: ${{ steps.run-test.outputs.test-exit-code }}
      with:
        script: |
          const { TestShards } = require(`${process.env.NODE_ACTION_PATH}/TestShards.cjs`);
          const shards = new TestShards(JSON.parse(process.env.SHARD_CONFIGURATION));
          shards.record(process.env.TEST_EXIT_CODE);
          core.setOutput('ready', true);
          core.setOutput('name', `${shards.group}-${shards.index}`);

    - name: Upload shard payload
      id: upload-shard
      if: always() && steps.shard-payload.outputs.ready == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.shard-payload.outputs.name }}
        path: |
          ${{ steps.prepare-test.outputs.payload }}/blob.json
          ${{ steps.prepare-test.outputs.payload }}/manifest.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

    - name: 📊 Parse test and coverage reports
      if: always() && inputs.shard == '' && (inputs.merge-shards == '' || steps.validate-shards.outcome == 'success')
      id: parse-coverage-reports
      uses: hoverkraft-tech/ci-github-common/actions/quality/parse-ci-reports@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
      with:
        working-directory: ${{ steps.working-directory.outputs.absolute-path }}
        report-name: "Test and Coverage Results"
        report-paths: ${{ inputs.report-file || ((inputs.coverage == 'github' || inputs.coverage == 'github-code-quality') && 'auto:test,auto:coverage' || 'auto:test') }}
        path-mapping: ${{ inputs.path-mapping }}
        output-format: "summary,markdown"

    - name: 📊 Add coverage PR comment
      if: always() && inputs.shard == '' && inputs.comment == 'true' && inputs.coverage == 'github' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.parse-coverage-reports.outputs.markdown
      uses: hoverkraft-tech/ci-github-common/actions/create-or-update-comment@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
      with:
        title: "Code Coverage Report"
        token: ${{ inputs.github-token }}
        body: ${{ steps.parse-coverage-reports.outputs.markdown }}

    - name: 📊 Upload coverage to Codecov
      if: always() && inputs.shard == '' && (inputs.merge-shards == '' || steps.validate-shards.outcome == 'success') && inputs.coverage == 'codecov'
      uses: hoverkraft-tech/ci-github-common/actions/quality/codecov@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
      with:
        working-directory: ${{ steps.working-directory.outputs.absolute-path }}

    - name: Prepare native report artifact
      id: report-artifact
      if: always() && steps.parse-coverage-reports.outputs.parsed-files != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPORT_FILES: ${{ steps.parse-coverage-reports.outputs.parsed-files }}
        REPORT_GROUP: ${{ inputs.report-group || github.job }}
        WORKING_DIRECTORY: ${{ steps.working-directory.outputs.absolute-path }}
      with:
        script: |
          const group = process.env.REPORT_GROUP;
          if (!/^[\w-]+$/.test(group)) {
            throw new Error('report-group must be a job ID containing letters, numbers, underscores or hyphens.');
          }
          const path = require('node:path');
          const source = path.relative(process.env.GITHUB_WORKSPACE, process.env.WORKING_DIRECTORY)
            .replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 120) || 'root';
          core.setOutput('files', JSON.parse(process.env.REPORT_FILES).join('\n'));
          core.setOutput('name', `ci-reports-${process.env.GITHUB_RUN_ATTEMPT}-${group}-${source}-${require('node:crypto').randomUUID()}`);

    - name: Upload native test and coverage reports
      id: upload-reports
      if: always() && steps.report-artifact.outputs.files != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.report-artifact.outputs.name }}
        path: ${{ steps.report-artifact.outputs.files }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

    - name: Clean shard workspace
      if: always() && steps.prepare-test.outputs.directory != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SHARD_DIRECTORY: ${{ steps.prepare-test.outputs.directory }}
      with:
        script: await io.rmRF(process.env.SHARD_DIRECTORY);

    - name: Prepare native GitHub coverage
      id: native-coverage
      if: ${{ !cancelled() && steps.run-test.outcome != 'skipped' && inputs.shard == '' && (inputs.merge-shards == '' || steps.validate-shards.outcome == 'success') && inputs.coverage == 'github-code-quality' }}
      uses: hoverkraft-tech/ci-github-common/actions/quality/coverage-reports@d52648f1645f1318908149af3f35b71b897ca566 # coverage support (PR #683, unreleased)
      with:
        working-directory: ${{ steps.working-directory.outputs.absolute-path }}
        report-group: ${{ inputs.report-group || github.job }}
        reports: ${{ inputs.coverage-reports || '[{"file":"coverage/cobertura-coverage.xml","language":"JavaScript"}]' }}
        source-sha: ${{ inputs.coverage-source-sha }}
        source-prefix: ${{ inputs.coverage-source-prefix }}
