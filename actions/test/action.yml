name: "Test"
description: |
  Action to test Node.js projects with support for coverage reporting and pull request annotations

  GitHub reporting retains native report artifacts for seven days, including after
  test failures. Set `comment: false` and call the common `ci-reports` workflow
  after test jobs to publish one test comment and one coverage comment.

  Note that this action must have write permission for id-token for this to work when using Codecov coverage reporting:

  ```yml
  permissions:
    id-token: write
  ```

author: hoverkraft
branding:
  icon: check-square
  color: blue

inputs:
  ignore-scripts:
    description: |
      Disable project and dependency lifecycle scripts during installation.
      Set false to allow installation hooks, subject to the package manager's script approval settings.
      Explicit commands are unaffected. Does not apply in container mode, which skips installation.
    default: "true"
  working-directory:
    description: |
      Working directory where test commands are executed.
      Can be absolute or relative to the repository root.
    required: false
    default: "."
  container:
    description: "Whether running in container mode (skips checkout and node setup)"
    required: false
    default: "false"
  command:
    description: |
      npm/pnpm/Yarn script command to run for testing.
      This should be a script defined in your `package.json`.
      The command should generate coverage report files in a standard format (Cobertura XML, lcov, etc.).

      Vitest: `vitest run --reporter=default --reporter=junit --outputFile=junit.xml --coverage.enabled --coverage.reporter=lcov --coverage.reporter=text`
      Jest: `jest --ci --reporters=default --reporters=jest-junit --coverage`
    required: false
    default: "test:ci"
  coverage:
    description: |
      Code coverage reporter to use. Supported values:
      - `github`: Parse coverage reports via [parse-ci-reports](https://github.com/hoverkraft-tech/ci-github-common/tree/main/actions/quality/parse-ci-reports) action, with GitHub summaries/PR comments
      - `codecov`: Upload coverage to Codecov
      - `""` or `null`: No coverage reporting
    required: false
    default: "github"
  report-file:
    description: |
      Optional test and coverage report paths forwarded to the [parse-ci-reports](https://github.com/hoverkraft-tech/ci-github-common/tree/main/actions/quality/parse-ci-reports) action.
      Supports multiple formats (Cobertura, OpenCover, lcov, etc.).
      Provide absolute paths or paths relative to the working directory.
      Multiple entries can be separated by newlines, commas, or semicolons.
      When omitted, the action falls back to `auto:test,auto:coverage` detection.
    required: false
    default: ""
  path-mapping:
    description: |
      Optional path mapping to adjust file paths in test and coverage reports.
      See the [parse-ci-reports documentation](https://github.com/hoverkraft-tech/ci-github-common/tree/main/actions/quality/parse-ci-reports) for details.
    required: false
    default: ""
  comment:
    description: Publish an individual coverage PR comment. Set false when using the common ci-reports workflow; GitHub summaries and report artifacts remain enabled.
    default: "true"
  github-token:
    description: |
      GitHub token for coverage PR comments.
      Required when coverage is `github` and individual comments are enabled.
      Requires permissions to create and update PR comments:

      - `issues: write`
      - `pull-requests: write`
    required: false
    default: ""

outputs:
  report-artifact-id:
    description: Native test and coverage artifact ID, empty when GitHub reports are unavailable.
    value: ${{ steps.upload-reports.outputs.artifact-id }}

runs:
  using: "composite"
  steps:
    # jscpd:ignore-start
    - id: working-directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@5fbb531db839a26ebcc35c4946be279f945f7633 # 1.0.0
      with:
        working-directory: ${{ inputs.working-directory }}
        enforce-path-in-workspace: ${{ inputs.container == 'true' && 'false' || 'true' }}
    # jscpd:ignore-end

    - id: setup-node
      if: inputs.container != 'true'
      uses: $/actions/setup-node
      with:
        working-directory: ${{ steps.working-directory.outputs.absolute-path }}
        ignore-scripts: ${{ inputs.ignore-scripts }}
        dependencies-cache: |
          nx
          jest
          vitest

    - id: get-package-manager
      if: inputs.container == 'true'
      uses: $/actions/get-package-manager
      with:
        working-directory: ${{ steps.working-directory.outputs.absolute-path }}

    - id: run-test
      name: 🧪 Run tests
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RUN_TEST_COMMAND: ${{ inputs.container == 'true' && steps.get-package-manager.outputs.run-script-command || steps.setup-node.outputs.run-script-command }}
        WORKING_DIRECTORY: ${{ steps.working-directory.outputs.absolute-path }}
        TEST_COMMAND: ${{ inputs.command }}
      with:
        script: |
          const workingDirectory = process.env.WORKING_DIRECTORY;
          core.debug(`Running in working directory: ${workingDirectory}`);
          process.chdir(workingDirectory);

          const runScriptCommand = process.env.RUN_TEST_COMMAND;
          const testCommand = process.env.TEST_COMMAND || 'test:ci';

          core.info(`🧪 Running test command: ${testCommand}...`);

          try {
            const exitCode = await exec.exec(runScriptCommand, [testCommand], {
              cwd: workingDirectory,
              env: { ...process.env, CI: 'true' },
              ignoreReturnCode: true
            });

            core.setOutput('test-exit-code', exitCode);

            if (exitCode !== 0) {
              core.setFailed(`Tests failed with exit code ${exitCode}`);
            }
          } catch (error) {
            core.setOutput('test-exit-code', 1);
            core.setFailed(`Test execution error: ${error.message}`);
          }

    - name: 📊 Parse coverage reports
      if: always() && inputs.coverage == 'github'
      id: parse-coverage-reports
      uses: hoverkraft-tech/ci-github-common/actions/quality/parse-ci-reports@90211d735aa0289702ddbd7eb95b218020ccadad # 2.0.2
      with:
        working-directory: ${{ steps.working-directory.outputs.absolute-path }}
        report-name: "Coverage Results"
        report-paths: ${{ inputs.report-file || 'auto:test,auto:coverage' }}
        path-mapping: ${{ inputs.path-mapping }}
        output-format: "summary,markdown"

    - name: 📊 Add coverage PR comment
      if: always() && inputs.comment == 'true' && inputs.coverage == 'github' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.parse-coverage-reports.outputs.markdown
      uses: hoverkraft-tech/ci-github-common/actions/create-or-update-comment@5fbb531db839a26ebcc35c4946be279f945f7633 # 1.0.0
      with:
        title: "Code Coverage Report"
        token: ${{ inputs.github-token }}
        body: ${{ steps.parse-coverage-reports.outputs.markdown }}

    - name: 📊 Upload coverage to Codecov
      if: always() && inputs.coverage == 'codecov'
      uses: hoverkraft-tech/ci-github-common/actions/quality/codecov@5fbb531db839a26ebcc35c4946be279f945f7633 # 1.0.0
      with:
        working-directory: ${{ steps.working-directory.outputs.absolute-path }}

    - name: Prepare native report artifact
      id: report-artifact
      if: always() && steps.parse-coverage-reports.outputs.parsed-files != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPORT_FILES: ${{ steps.parse-coverage-reports.outputs.parsed-files }}
      with:
        script: |
          core.setOutput('files', JSON.parse(process.env.REPORT_FILES).join('\n'));
          core.setOutput('id', require('node:crypto').randomUUID());

    - name: Upload native test and coverage reports
      id: upload-reports
      if: always() && steps.report-artifact.outputs.files != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-reports-${{ github.run_attempt }}-${{ github.job }}-${{ steps.report-artifact.outputs.id }}
        path: ${{ steps.report-artifact.outputs.files }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
