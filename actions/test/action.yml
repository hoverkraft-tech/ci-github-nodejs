name: "Test"
description: |
  Run project test commands and validate their native reports before publication.

  Commands receive CI_REPORTS_DIR, a fresh directory for this execution. Write
  required reports there; stale files in the project cannot satisfy the contract.
  Missing or malformed reports fail even after a successful command. Available
  diagnostics are retained after failures. Call common ci-reports once after all checks.
  Producer jobs require actions: read and contents: read, with source checked out and Git available (including in CI containers).
  CI_TEST_COVERAGE indicates whether to instrument tests. By default, results.json
  supplies both test results and coverage using native Vitest or Jest JSON. Set
  test-results and test-coverage to separate paths for runners such as node:test.
  See the [native test report guide](../../docs/usage/test-reports.md) for runner and shard configuration.
author: hoverkraft
branding:
  icon: check-square
  color: blue

inputs:
  ignore-scripts:
    description: |
      Disable project and dependency lifecycle scripts during installation.
      Set false to allow installation hooks, subject to the package manager's script approval settings.
      Explicit commands are unaffected. Does not apply in container mode, which skips installation.
    default: "true"
  working-directory:
    description: |
      Working directory where test commands are executed.
      Can be absolute or relative to the repository root.
    required: false
    default: "."
  container:
    description: "Whether running in container mode (skips checkout and node setup)"
    required: false
    default: "false"
  command:
    description: |-
      Package script to run. Write native reports into CI_REPORTS_DIR and enable coverage when CI_TEST_COVERAGE is true. See the native test report guide for Vitest, Jest, node:test and sharding configuration.
    required: false
    default: "test:ci"
  coverage:
    description: Collect and require coverage. The project command must honor CI_TEST_COVERAGE when selecting instrumentation.
    default: "true"
  arguments:
    description: |
      JSON array of arguments passed to the package script without shell expansion.
      npm receives its required `--` separator; pnpm and Yarn receive arguments directly.
    default: "[]"
  shard:
    description: |
      Optional Vitest shard as index/total, for example `1/2`. Requires shard-group.
      Adds native shard/blob arguments, sets CI_TEST_SHARD, and uploads a checked blob payload
      after tests, including failures. Individual reporting is disabled for shards.
      Use reporter-specific `--outputFile.json` rather than scalar `--outputFile` in the package script.
      Keep coverage collection enabled; defer configured coverage thresholds to the merge
      when CI_TEST_SHARD is nonempty. The workflow normally supplies these orchestration inputs.
    default: ""
  shard-group:
    description: |
      Unique artifact group for this project, workflow invocation, run and attempt.
      Use only letters, numbers, underscores and hyphens. Never reuse across attempts.
      All shards and their merge must use the same group and absolute project directory.
    default: ""
  merge-shards:
    description: |
      Optional expected Vitest shard count (2-256). Requires shard-group and excludes shard.
      Downloads this run's matching payloads, validates the complete set and adds --merge-reports.
      The package script must enable final reporters and original coverage thresholds.
      A failed shard remains fatal even if merging succeeds. Partial reruns require a full workflow rerun.
    default: ""
  path-mapping:
    description: |-
      Optional JSON object mapping native report source path prefixes to repository-relative directories.
    required: false
    default: ""
  source-sha:
    description: Source commit tested by a prebuilt container; must equal the checked-out revision.
    default: ""
  source-prefix:
    description: Repository-relative directory represented by a prebuilt working-directory. Required with source-sha outside GITHUB_WORKSPACE; use a dot for the repository root.
    default: ""
  test-results:
    description: Required native test report paths relative to CI_REPORTS_DIR, one per line. A combined JSON report can also supply coverage.
    default: results.json
  test-coverage:
    description: Required native coverage paths relative to CI_REPORTS_DIR when coverage is enabled, one per line. Defaults to test-results for combined JSON, or coverage/lcov.info when merging Vitest shards. Vitest shard merging emits coverage separately; enable lcovonly when CI_TEST_MERGE is true.
    default: ""

outputs:
  report-artifact-id:
    description: Native report bundle, including available diagnostics after failures.
    value: ${{ steps.reports.outputs.artifact-id }}
  shard-artifact-id:
    description: Blob and manifest artifact ID for an executing shard, including failed tests with a blob.
    value: ${{ steps.upload-shard.outputs.artifact-id }}

runs:
  using: "composite"
  steps:
    # jscpd:ignore-start
    - id: working-directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
      with:
        working-directory: ${{ inputs.working-directory }}
        enforce-path-in-workspace: ${{ inputs.container == 'true' && 'false' || 'true' }}
    # jscpd:ignore-end

    - id: prepare-test
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        NODE_ACTION_PATH: ${{ github.action_path }}
        WORKING_DIRECTORY: ${{ steps.working-directory.outputs.absolute-path }}
        COVERAGE_DESTINATION: ${{ inputs.coverage }}
        TEST_COMMIT: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
        TEST_ARGUMENTS: ${{ inputs.arguments }}
        TEST_SHARD: ${{ inputs.shard }}
        SHARD_GROUP: ${{ inputs.shard-group }}
        MERGE_SHARDS: ${{ inputs.merge-shards }}
      with:
        script: |
          if (!['true','false'].includes(process.env.COVERAGE_DESTINATION)) throw new Error('coverage must be true or false.');
          const { TestShards } = require(`${process.env.NODE_ACTION_PATH}/TestShards.cjs`);
          const configuration = {
            workingDirectory: process.env.WORKING_DIRECTORY,
            temporaryDirectory: process.env.RUNNER_TEMP,
            group: process.env.SHARD_GROUP,
            shard: process.env.TEST_SHARD,
            mergeShards: process.env.MERGE_SHARDS,
            identity: {
              runId: process.env.GITHUB_RUN_ID,
              attempt: process.env.GITHUB_RUN_ATTEMPT,
              sha: process.env.TEST_COMMIT
            }
          };
          const shards = new TestShards(configuration);
          core.setOutput('arguments', shards.prepare(TestShards.arguments(process.env.TEST_ARGUMENTS)));
          core.setOutput('configuration', configuration);
          core.setOutput('directory', shards.directory || '');
          core.setOutput('payload', shards.index ? shards.payload : '');
          core.setOutput('incoming', shards.incoming || '');
          core.setOutput('group', shards.group || '');

    - id: setup-node
      if: inputs.container != 'true'
      uses: $/actions/setup-node
      with:
        working-directory: ${{ steps.working-directory.outputs.absolute-path }}
        ignore-scripts: ${{ inputs.ignore-scripts }}
        dependencies-cache: |
          nx
          jest
          vitest

    - id: get-package-manager
      if: inputs.container == 'true'
      uses: $/actions/get-package-manager
      with:
        working-directory: ${{ steps.working-directory.outputs.absolute-path }}

    - name: Download shard payloads
      if: inputs.merge-shards != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ steps.prepare-test.outputs.group }}-*
        path: ${{ steps.prepare-test.outputs.incoming }}
    - id: definition
      if: inputs.shard == ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        NODE_ACTION_PATH: ${{ github.action_path }}
        WORKING_DIRECTORY: ${{ steps.working-directory.outputs.absolute-path }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        SOURCE_PREFIX: ${{ inputs.source-prefix }}
        PATH_MAPPING: ${{ inputs.path-mapping }}
        RESULTS: ${{ inputs.test-results }}
        COVERAGE: ${{ inputs.coverage }}
        COVERAGE_PATHS: ${{ inputs.test-coverage || (inputs.merge-shards != '' && 'coverage/lcov.info' || inputs.test-results) }}
        MERGE_SHARDS: ${{ inputs.merge-shards }}
      with:
        script: |
          const { ReportDefinition } = require(process.env.NODE_ACTION_PATH + '/../reporting/ReportDefinition.cjs');
          const runtime = await exec.getExecOutput('node', ['--version'], {silent: true});
          core.setOutput('definition', ReportDefinition.create({
            kind: 'test', workspace: process.env.GITHUB_WORKSPACE, directory: process.env.WORKING_DIRECTORY,
            runtime: runtime.stdout.trim(), sourceSha: process.env.SOURCE_SHA, sourcePrefix: process.env.SOURCE_PREFIX,
            mapping: process.env.PATH_MAPPING, results: process.env.RESULTS, coverage: process.env.COVERAGE,
            coveragePaths: process.env.COVERAGE_PATHS, shards: process.env.MERGE_SHARDS
          }));
    - id: prepare-reports
      if: inputs.shard == ''
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@c0b651dd3d5f9ce5eff49c3c675c1f5c7f2ca581 # PR #683 (unreleased)
      with:
        operation: prepare
        definition: ${{ steps.definition.outputs.definition }}

    - id: validate-shards
      if: inputs.merge-shards != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        NODE_ACTION_PATH: ${{ github.action_path }}
        SHARD_CONFIGURATION: ${{ steps.prepare-test.outputs.configuration }}
      with:
        script: |
          const { TestShards } = require(`${process.env.NODE_ACTION_PATH}/TestShards.cjs`);
          const shards = new TestShards(JSON.parse(process.env.SHARD_CONFIGURATION));
          core.setOutput('failed', shards.validate());

    - id: run-test
      name: 🧪 Run tests
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        NODE_ACTION_PATH: ${{ github.action_path }}
        RUN_TEST_COMMAND: ${{ inputs.container == 'true' && steps.get-package-manager.outputs.run-script-command || steps.setup-node.outputs.run-script-command }}
        WORKING_DIRECTORY: ${{ steps.working-directory.outputs.absolute-path }}
        TEST_COMMAND: ${{ inputs.command }}
        TEST_ARGUMENTS: ${{ steps.prepare-test.outputs.arguments }}
        TEST_SHARD: ${{ inputs.shard }}
        SHARDS_FAILED: ${{ steps.validate-shards.outputs.failed }}
        CI_REPORTS_DIR: ${{ steps.prepare-reports.outputs.report-directory || steps.prepare-test.outputs.directory }}
        CI_TEST_COVERAGE: ${{ inputs.coverage }}
        CI_TEST_MERGE: ${{ inputs.merge-shards != '' && 'true' || 'false' }}
      with:
        script: |
          const workingDirectory = process.env.WORKING_DIRECTORY;
          core.debug(`Running in working directory: ${workingDirectory}`);
          process.chdir(workingDirectory);

          const runScriptCommand = process.env.RUN_TEST_COMMAND;
          const testCommand = process.env.TEST_COMMAND || 'test:ci';
          const { TestShards } = require(`${process.env.NODE_ACTION_PATH}/TestShards.cjs`);
          const args = TestShards.scriptArguments(runScriptCommand, testCommand, TestShards.arguments(process.env.TEST_ARGUMENTS));

          core.info(`🧪 Running test command: ${testCommand}...`);

          try {
            const exitCode = await exec.exec(runScriptCommand, args, {
              cwd: workingDirectory,
              env: { ...process.env, CI: 'true', CI_TEST_SHARD: process.env.TEST_SHARD || '' },
              ignoreReturnCode: true
            });

            core.setOutput('test-exit-code', exitCode);

            if (exitCode !== 0) {
              core.setFailed(`Tests failed with exit code ${exitCode}`);
            } else if (process.env.SHARDS_FAILED === 'true') {
              core.setFailed('One or more test shards failed, even though report merging succeeded.');
            }
          } catch (error) {
            core.setOutput('test-exit-code', 1);
            core.setFailed(`Test execution error: ${error.message}`);
          }

    - name: Record shard payload
      id: shard-payload
      if: always() && inputs.shard != '' && steps.prepare-test.outputs.payload != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        NODE_ACTION_PATH: ${{ github.action_path }}
        SHARD_CONFIGURATION: ${{ steps.prepare-test.outputs.configuration }}
        TEST_EXIT_CODE: ${{ steps.run-test.outputs.test-exit-code }}
      with:
        script: |
          const { TestShards } = require(`${process.env.NODE_ACTION_PATH}/TestShards.cjs`);
          const shards = new TestShards(JSON.parse(process.env.SHARD_CONFIGURATION));
          shards.record(process.env.TEST_EXIT_CODE);
          core.setOutput('ready', true);
          core.setOutput('name', `${shards.group}-${shards.index}`);

    - name: Upload shard payload
      id: upload-shard
      if: always() && steps.shard-payload.outputs.ready == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.shard-payload.outputs.name }}
        path: |
          ${{ steps.prepare-test.outputs.payload }}/blob.json
          ${{ steps.prepare-test.outputs.payload }}/manifest.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    - id: reports
      name: Validate and retain native reports
      if: ${{ !cancelled() && steps.prepare-reports.outcome == 'success' }}
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@c0b651dd3d5f9ce5eff49c3c675c1f5c7f2ca581 # PR #683 (unreleased)
      with:
        operation: finalize
        recording: ${{ steps.prepare-reports.outputs.recording }}
        outcome: ${{ steps.run-test.outcome }}

    - name: Clean shard workspace
      if: always() && steps.prepare-test.outputs.directory != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SHARD_DIRECTORY: ${{ steps.prepare-test.outputs.directory }}
      with:
        script: await io.rmRF(process.env.SHARD_DIRECTORY);
