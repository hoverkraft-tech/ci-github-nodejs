name: "Package"
description: |
  Create and upload a package tarball from prepared files, optionally restored from a build artifact.
  Check out the project, configure Node.js and its package manager, and prepare dependencies, versions and build output before calling this action.
  Uses the project's npm, pnpm or Yarn Classic configuration to select its native pack command.
  Packaging never installs dependencies, changes versions or runs lifecycle scripts.
author: hoverkraft
branding:
  icon: package
  color: blue

inputs:
  working-directory:
    description: |
      Prepared project directory containing the package manager configuration.
      Can be absolute or relative to the repository root.
    required: false
    default: "."
  package-directory:
    description: |
      Optional prepared package directory to pack.
      Can be absolute or relative to `working-directory`.
      Useful for monorepos with package manager configuration at the root.
    required: false
    default: ""
  build-artifact-id:
    description: |
      Optional build artifact ID to download before packaging.
      When provided, the artifact will be downloaded to the workspace.
    required: false
    default: ""
  build-artifact-path:
    description: |
      Optional path to the build artifact contents relative to the workspace root.
      Used to locate the files to be included in the package when a build artifact is downloaded.
    required: false
    default: "${{ github.workspace }}"
  artifact-name:
    description: "Name of the uploaded package tarball artifact"
    required: false
    default: ""

outputs:
  package-tarball-path:
    description: "Absolute path to the generated package tarball"
    value: ${{ steps.package.outputs.package-tarball-path }}
  package-tarball-artifact-id:
    description: "Artifact ID of the uploaded package tarball (download with skip-decompress: true)"
    value: ${{ steps.upload-package-tarball.outputs.artifact-id }}

runs:
  using: "composite"
  steps:
    - name: Validate build artifact ID
      if: inputs.build-artifact-id != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BUILD_ARTIFACT_ID: ${{ inputs.build-artifact-id }}
      with:
        script: |
          const artifactId = process.env.BUILD_ARTIFACT_ID;
          if (!/^[1-9][0-9]*$/.test(artifactId) || !Number.isSafeInteger(Number(artifactId))) {
            core.setFailed('Expected one positive build artifact ID.');
          }

    # jscpd:ignore-start
    - id: working-directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@2fa562bd44f9e752a99a374c85ae14644e7f2bdd # 4.2.2
      with:
        working-directory: ${{ inputs.working-directory }}
        enforce-path-in-workspace: "false"
    # jscpd:ignore-end

    - name: Download build artifacts
      if: inputs.build-artifact-id != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.build-artifact-id }}
        path: ${{ inputs.build-artifact-path }}

    - id: get-package-manager
      uses: $/actions/get-package-manager
      with:
        working-directory: ${{ steps.working-directory.outputs.absolute-path }}

    - id: package
      name: Create package tarball for verification
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        WORKING_DIRECTORY: ${{ steps.working-directory.outputs.absolute-path }}
        PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        PACK_COMMAND: ${{ steps.get-package-manager.outputs.pack-command }}
        ARTIFACT_NAME_INPUT: ${{ inputs.artifact-name }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        RUNNER_TEMP: ${{ runner.temp }}
      with:
        script: |
          const { randomUUID } = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const workingDirectory = process.env.WORKING_DIRECTORY;
          const packageDirectoryInput = (process.env.PACKAGE_DIRECTORY || '').trim();
          const packageDirectory = packageDirectoryInput ? path.resolve(workingDirectory, packageDirectoryInput) : workingDirectory;
          core.debug(`Running in working directory: ${workingDirectory}`);
          core.debug(`Package directory: ${packageDirectory}`);
          process.chdir(workingDirectory);

          const runnerTemp = process.env.RUNNER_TEMP;

          const packageJsonPath = path.join(packageDirectory, 'package.json');
          if (!fs.existsSync(packageJsonPath)) {
            core.setFailed(`package.json not found in package directory: ${packageDirectory}`);
            return;
          }

          const packCommand = process.env.PACK_COMMAND?.trim();
          if (!packCommand) {
            core.setFailed('Pack command is empty');
            return;
          }

          const packDirectory = fs.mkdtempSync(path.join(runnerTemp, 'package-'));
          const artifactNameInput = (process.env.ARTIFACT_NAME_INPUT || '').trim();
          const artifactName = artifactNameInput || `package-tarball-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}-${randomUUID()}`;
          const sanitizedArtifactName = artifactName.replace(/[^a-zA-Z0-9._-]+/g, '-');
          const uniqueTarballPath = path.join(runnerTemp, `${sanitizedArtifactName}.tgz`);

          try {
            await exec.exec('bash', ['-e', '-o', 'pipefail', '-c', packCommand], {
              cwd: packageDirectory,
              env: { ...process.env, PACK_DESTINATION: packDirectory },
            });

            const tarballs = await (await glob.create(`${packDirectory}/*.tgz`, {
              followSymbolicLinks: false,
              matchDirectories: false,
            })).glob();
            if (tarballs.length !== 1) {
              throw new Error(`Expected one package tarball, found ${tarballs.length}.`);
            }
            await io.mv(tarballs[0], uniqueTarballPath);
          } finally {
            await io.rmRF(packDirectory);
          }

          core.info(`Generated package tarball: ${uniqueTarballPath}`);
          core.setOutput('package-tarball-path', uniqueTarballPath);

    - id: resolve-artifact-name
      name: Resolve package tarball artifact name
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PACKAGE_TARBALL_PATH: ${{ steps.package.outputs.package-tarball-path }}
      with:
        script: |
          const path = require('node:path');

          const packageTarballPath = process.env.PACKAGE_TARBALL_PATH;
          const artifactName = path.basename(packageTarballPath, path.extname(packageTarballPath));

          core.info(`Package tarball artifact name: ${artifactName}`);
          core.setOutput('artifact-name', artifactName);

    - name: Upload package tarball
      id: upload-package-tarball
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.resolve-artifact-name.outputs.artifact-name }}
        path: ${{ steps.package.outputs.package-tarball-path }}
        archive: false
        if-no-files-found: error
