name: "Publish"
description: "Publish an existing Node.js package tarball to an npm-compatible registry"
author: hoverkraft
branding:
  icon: upload-cloud
  color: blue

inputs:
  name:
    description: Expected package name, paired with version to reject an unintended release tarball before publication.
    default: ""
  version:
    description: Expected package version, paired with name to reject an unintended release tarball before publication.
    default: ""
  recover-existing:
    description: Recover an existing npmjs.org version by restoring its original tarball instead of publishing again. Checks the registry on every attempt.
    default: "false"
  package-tarball-artifact-id:
    description: "Artifact ID of one package tarball uploaded by the package action"
    required: true
  registry-url:
    description: "Registry URL used by npm publish"
    required: false
    default: "https://registry.npmjs.org"
  access:
    description: "Package access: public, restricted, or empty to use npm defaults"
    required: false
    default: "public"
  tag:
    description: "npm distribution tag, such as latest, next, or canary; empty uses npm defaults"
    required: false
    default: ""
  provenance:
    description: "Whether to request provenance for npmjs.org publishes (true or false)"
    required: false
    default: "true"
  dry-run:
    description: "Validate the tarball without uploading (true or false). Enables npm force mode only during dry runs so CI can check already-published versions. Live publication keeps npm's version checks."
    required: false
    default: "false"
  github-token:
    description: "GitHub token for downloading the artifact; registry authentication uses NODE_AUTH_TOKEN or OIDC"
    required: false
    default: ${{ github.token }}

outputs:
  package-tarball-path:
    description: Local path to the published tarball, restored from npm when recover-existing finds an existing version.
    value: ${{ steps.package-tarball.outputs.path }}

runs:
  using: "composite"
  steps:
    - id: validate
      name: Validate publish inputs
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PACKAGE_TARBALL_ARTIFACT_ID: ${{ inputs.package-tarball-artifact-id }}
        ACCESS: ${{ inputs.access }}
        PROVENANCE: ${{ inputs.provenance }}
        DRY_RUN: ${{ inputs.dry-run }}
        RECOVER_EXISTING: ${{ inputs.recover-existing }}
        REGISTRY_URL: ${{ inputs.registry-url }}
        RUNNER_TEMP: ${{ runner.temp }}
        EXPECTED_NAME: ${{ inputs.name }}
        EXPECTED_VERSION: ${{ inputs.version }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');

          if (Boolean(process.env.EXPECTED_NAME) !== Boolean(process.env.EXPECTED_VERSION)) {
            return core.setFailed('name and version must be provided together.');
          }

          if (!/^[1-9][0-9]*$/.test(process.env.PACKAGE_TARBALL_ARTIFACT_ID || '')) {
            return core.setFailed('package-tarball-artifact-id must be a single positive artifact ID');
          }

          if (!['', 'public', 'restricted'].includes(process.env.ACCESS.trim())) {
            return core.setFailed('access must be public, restricted, or empty');
          }

          for (const input of ['PROVENANCE', 'DRY_RUN', 'RECOVER_EXISTING']) {
            if (!['true', 'false'].includes(process.env[input])) {
              return core.setFailed(`${input.toLowerCase().replaceAll('_', '-')} must be true or false`);
            }
          }

          try {
            const registry = new URL(process.env.REGISTRY_URL);
            if (process.env.RECOVER_EXISTING === 'true' && registry.origin !== 'https://registry.npmjs.org') {
              return core.setFailed('recover-existing requires the public npm registry.');
            }
            if (!['https:', 'http:'].includes(registry.protocol)) {
              return core.setFailed('registry-url must use HTTP or HTTPS');
            }
          } catch {
            return core.setFailed('registry-url must be a valid URL');
          }

          core.setOutput('download-path', fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'package-publish-')));

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        registry-url: ${{ inputs.registry-url }}
        node-version: "lts/*"

    - name: Download package tarball
      id: download-package-tarball
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.package-tarball-artifact-id }}
        path: ${{ steps.validate.outputs.download-path }}
        skip-decompress: true
        github-token: ${{ inputs.github-token }}

    - id: package-tarball
      name: Locate package tarball
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PACKAGE_TARBALL_DOWNLOAD_PATH: ${{ steps.download-package-tarball.outputs.download-path }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');

          const downloadPath = process.env.PACKAGE_TARBALL_DOWNLOAD_PATH;

          if (!fs.existsSync(downloadPath)) {
            return core.setFailed(`Package tarball download path does not exist: ${downloadPath}`);
          }

          const globber = await glob.create(path.join(downloadPath, '**/*.tgz'), {
            followSymbolicLinks: false,
            matchDirectories: false,
            implicitDescendants: false,
          });
          const packageTarballPaths = fs.statSync(downloadPath).isDirectory()
            ? (await globber.glob()).filter(file => fs.lstatSync(file).isFile())
            : downloadPath.endsWith('.tgz') ? [downloadPath] : [];

          if (packageTarballPaths.length === 0) {
            return core.setFailed(`Package tarball not found in ${downloadPath}`);
          }

          if (packageTarballPaths.length > 1) {
            return core.setFailed(`Expected one package tarball, found ${packageTarballPaths.length}: ${packageTarballPaths.join(', ')}`);
          }

          core.info(`Package tarball: ${packageTarballPaths[0]}`);
          core.setOutput('path', packageTarballPaths[0]);

    - id: package-identity
      name: Verify package identity
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PACKAGE_TARBALL_PATH: ${{ steps.package-tarball.outputs.path }}
        EXPECTED_NAME: ${{ inputs.name }}
        EXPECTED_VERSION: ${{ inputs.version }}
      with:
        script: |
          const tarballPath = process.env.PACKAGE_TARBALL_PATH;
          const { stdout } = await exec.getExecOutput('tar', ['-xOf', tarballPath, 'package/package.json'], { silent: true });
          const manifest = JSON.parse(stdout);
          const { name, version } = manifest;
          if (typeof name !== 'string' || !name || typeof version !== 'string' || !version || manifest.private) {
            return core.setFailed('Publication requires a named, versioned, non-private package.');
          }
          if (process.env.EXPECTED_NAME && (name !== process.env.EXPECTED_NAME || version !== process.env.EXPECTED_VERSION)) {
            return core.setFailed('Package tarball must match the expected release name and version.');
          }
          for (const field of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
            if (Object.values(manifest[field] || {}).some(value => typeof value === 'string' && value.startsWith('workspace:'))) {
              return core.setFailed('Package tarball contains unresolved workspace dependency references.');
            }
          }
          core.setOutput('name', name);
          core.setOutput('version', version);

    - id: existing
      name: Recover an existing npm version
      if: inputs.recover-existing == 'true'
      uses: $/actions/package/restore
      with:
        name: ${{ steps.package-identity.outputs.name }}
        version: ${{ steps.package-identity.outputs.version }}
        tarball-path: ${{ steps.package-tarball.outputs.path }}

    - name: Publish package
      if: steps.existing.outputs.published != 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PACKAGE_TARBALL_PATH: ${{ steps.package-tarball.outputs.path }}
        ACCESS: ${{ inputs.access }}
        TAG: ${{ inputs.tag }}
        PROVENANCE: ${{ inputs.provenance }}
        DRY_RUN: ${{ inputs.dry-run }}
        REGISTRY_URL: ${{ inputs.registry-url }}
      with:
        script: |
          const path = require('node:path');

          const packageTarballPath = process.env.PACKAGE_TARBALL_PATH;
          const access = process.env.ACCESS?.trim();
          const tag = process.env.TAG?.trim();
          const registryUrl = process.env.REGISTRY_URL ?? '';
          const dryRun = process.env.DRY_RUN === 'true';
          const provenance = process.env.PROVENANCE === 'true';

          const args = ['publish', packageTarballPath, '--registry', registryUrl];

          if (access) {
            args.push('--access', access);
          }

          if (tag) {
            args.push('--tag', tag);
          }

          if (provenance && new URL(registryUrl).origin === 'https://registry.npmjs.org') {
            args.push('--provenance');
          }

          if (dryRun) {
            // CI validates committed versions that can already exist on npm.
            // Keep registry conflict checks enabled for actual publication.
            args.push('--dry-run', '--force');
          }

          core.info(`Publishing ${path.basename(packageTarballPath)} to ${registryUrl} with npm ${args.join(' ')}`);

          try {
            const exitCode = await exec.exec('npm', args, {
              ignoreReturnCode: true
            });

            if (exitCode !== 0) {
              return core.setFailed(`Package publish failed with exit code ${exitCode}`);
            }

            core.info(dryRun ? 'Package publish dry run completed successfully.' : 'Package published successfully!');
          } catch (error) {
            return core.setFailed(`Package publish failed: ${error.message}`);
          }
